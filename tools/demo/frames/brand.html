<!doctype html>
<meta charset="utf-8" />
<title>muxr brand graphic</title>
<style>
  @font-face { font-family: 'Display'; src: url('__FONT_DISPLAY__') format('truetype'); font-weight: 700; font-display: block; }
  @font-face { font-family: 'Plex'; src: url('__FONT_SANS__') format('truetype'); font-weight: 400; font-display: block; }
  @font-face { font-family: 'Plex'; src: url('__FONT_SANS_SEMI__') format('truetype'); font-weight: 600; font-display: block; }
  @font-face { font-family: 'PlexMono'; src: url('__FONT_MONO__') format('truetype'); font-weight: 400; font-display: block; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: var(--w); height: var(--h); }
  body {
    --w: 1024px; --h: 500px; --s: 1;
    background: radial-gradient(120% 90% at 50% 0%, #17171c 0%, #0b0b0d 64%), #0b0b0d;
    overflow: hidden; position: relative;
    font-family: 'Plex', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    color: #f2f2f4;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(120px); pointer-events: none; }
  .glow.a { width: 700px; height: 700px; left: -190px; top: -230px; background: rgba(96, 211, 184, 0.26); }
  .glow.b { width: 620px; height: 620px; right: -180px; bottom: -220px; background: rgba(118, 139, 255, 0.22); }
  .grain {
    position: absolute; inset: 0; opacity: 0.4; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 4px 4px;
  }

  .stage {
    position: relative; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(26px * var(--s)); padding: 0 calc(64px * var(--s)); text-align: center;
  }
  .mark { width: calc(300px * var(--s)); filter: brightness(0) invert(1); }
  h1 {
    font-family: 'Display', system-ui, sans-serif; font-weight: 700;
    font-size: calc(56px * var(--s)); line-height: 1.06; letter-spacing: -0.028em;
  }
  .rule { height: calc(3px * var(--s)); width: calc(180px * var(--s)); background: #60d3b8; opacity: 0.85; }
  .states {
    display: flex; gap: calc(34px * var(--s)); align-items: center;
    font-family: 'PlexMono', ui-monospace, monospace; font-size: calc(20px * var(--s));
    letter-spacing: 0.14em; text-transform: uppercase; color: #9a9a9f;
  }
  .states span { display: flex; align-items: center; gap: calc(11px * var(--s)); }
  .dot { width: calc(11px * var(--s)); height: calc(11px * var(--s)); border-radius: 50%; }
  /* The product's own status law: blue works, red needs you, green is done. */
  .dot.working { background: #0A84FF; }
  .dot.blocked { background: #FF453A; }
  .dot.done { background: #30D158; }
  .foot { font-size: calc(21px * var(--s)); color: #9a9a9f; }
</style>
<body>
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="grain"></div>
  <div class="stage">
    <img class="mark" id="mark" />
    <h1 id="line"></h1>
    <div class="rule"></div>
    <div class="states">
      <span><i class="dot working"></i>working</span>
      <span><i class="dot blocked"></i>blocked</span>
      <span><i class="dot done"></i>done</span>
    </div>
    <div class="foot" id="foot"></div>
  </div>
<script>
  const data = __DATA__;
  const body = document.body;
  body.style.setProperty('--w', data.width + 'px');
  body.style.setProperty('--h', data.height + 'px');
  body.style.setProperty('--s', String(data.scale ?? 1));
  document.getElementById('mark').src = data.wordmark;
  document.getElementById('line').textContent = data.line;
  document.getElementById('foot').textContent = data.foot;
  document.fonts.ready.then(() => { document.title = 'ready'; });
</script>
</body>
