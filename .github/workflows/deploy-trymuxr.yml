name: deploy trymuxr.com

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trymuxr-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    if: github.repository == 'umeranjum17/muxr' && github.ref == 'refs/heads/main'
    environment: trymuxr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn workspace @trymuxr/site build
      - run: yarn workspace @trymuxr/site test
      - name: Smoke the production image
        run: |
          set -euo pipefail
          docker build --file apps/site/Dockerfile --tag trymuxr-site:smoke .
          container=$(docker run --detach --publish 127.0.0.1::8080 trymuxr-site:smoke)
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          port=$(docker port "$container" 8080/tcp | cut -d: -f2)
          ready=
          for _ in {1..30}; do
            if curl --fail --silent --max-time 5 "http://127.0.0.1:${port}/ready" >/dev/null; then ready=yes; break; fi
            sleep 2
          done
          [ -n "$ready" ] || { echo 'Site image did not become ready' >&2; exit 1; }
          check() {
            status=$(curl --silent --max-time 10 --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${port}$1")
            case " $2 " in
              *" ${status} "*) ;;
              *) echo 'Site image route check failed' >&2; exit 1 ;;
            esac
          }
          check / 200
          check /marketing/campaign-connection.png 200
          check /demo.mp4 200
          check /desktop 200
          check /downloads '200 503'
          check /downloads/stable/android '302 503'
          check /api/releases/stable '200 503'
      - name: Deploy through Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          APPLICATION_UUID: ${{ secrets.COOLIFY_WEB_APP_UUID }}
        run: |
          set -euo pipefail
          [ -n "$COOLIFY_TOKEN" ] && [ -n "$COOLIFY_URL" ] && [ -n "$APPLICATION_UUID" ] || { echo 'Deployment secrets are missing' >&2; exit 1; }
          # Response bodies and curl diagnostics may contain private infrastructure.
          # Capture bodies in memory, suppress diagnostics, and print fixed errors only.
          response=$(curl --fail --silent --max-time 30 --request POST \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${APPLICATION_UUID}&force=true" 2>/dev/null) || { echo 'Deployment request failed' >&2; exit 1; }
          deployment=$(jq -er '.deployments[0].deployment_uuid | select(type == "string") | select(test("^[a-zA-Z0-9_-]+$"))' <<<"${response}" 2>/dev/null) || { echo 'Deployment response was invalid' >&2; exit 1; }
          for _ in {1..180}; do
            response=$(curl --fail --silent --max-time 30 \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${COOLIFY_URL}/api/v1/deployments/${deployment}" 2>/dev/null) || { echo 'Deployment status request failed' >&2; exit 1; }
            status=$(jq -er '.status' <<<"${response}" 2>/dev/null) || { echo 'Deployment status was invalid' >&2; exit 1; }
            case "$status" in
              finished) exit 0 ;;
              failed|cancelled) echo 'Deployment failed or was cancelled' >&2; exit 1 ;;
            esac
            sleep 5
          done
          echo 'Deployment timed out' >&2
          exit 1
      - name: Verify production health
        env:
          HEALTH_URL: ${{ secrets.COOLIFY_WEB_HEALTH_URL }}
        run: |
          [ -n "$HEALTH_URL" ] || { echo 'Health secret is missing' >&2; exit 1; }
          curl --fail --silent --max-time 15 --retry 10 --retry-delay 3 --retry-all-errors "$HEALTH_URL" >/dev/null 2>&1 || { echo 'Production health check failed' >&2; exit 1; }
