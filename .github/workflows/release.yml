name: release

# A release is a merged version bump. Every push to main runs the full suite;
# when the root package.json version is not yet on npm, the same job packs
# @trymuxr/cli, checks the installed package and publishes it with provenance
# through npm trusted publishing (OIDC). No npm token exists anywhere. The
# publish step fails until npm links this repository and this workflow as the
# package's trusted publisher; that is expected for the first release.
#
# Gaps, not published by this workflow:
# - @desklink/host and its platform packages: published from the desklink repository.
# - @trymuxr/contract and @trymuxr/crypto: workspace libraries, not published; publish or mark private is a maintainer decision.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Two publications never race for one version.
  group: npm-publication
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'umeranjum17/muxr'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11.6.2
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn build
      - name: Full suite (typecheck, flows, e2e, package smoke, architecture)
        run: yarn run check
      - id: release
        name: Decide whether this version is unpublished
        run: node scripts/release/presentation/releaseNeeded.mjs
      - name: Pack and check the installed package
        if: steps.release.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          yarn run pack
          mkdir -p "$RUNNER_TEMP/package"
          npm pack ./dist-npm --pack-destination "$RUNNER_TEMP/package"
          install_root="$RUNNER_TEMP/release-install"
          npm install --prefix "$install_root" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/package/*.tgz
          mkdir -p "$RUNNER_TEMP/release-home"
          cli="$install_root/node_modules/@trymuxr/cli/cli.mjs"
          # The installed CLI reports the version about to be published.
          test "$(HOME="$RUNNER_TEMP/release-home" node "$cli" version)" = "$VERSION"
      - name: Seal the packed tarball as the release candidate
        if: steps.release.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          node --input-type=module <<'JS'
          import { readdirSync } from 'node:fs';
          import { sealRelease } from './scripts/release/application/sealRelease.mjs';
          const directory = `${process.env.RUNNER_TEMP}/package`;
          await sealRelease({ directory, version: process.env.VERSION, channel: process.env.CHANNEL, files: readdirSync(directory), runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT });
          JS
      - name: Publish with provenance
        if: steps.release.outputs.needed == 'true'
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: node scripts/release/presentation/publishNpm.mjs
