appId: com.trymuxr.app
---
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Plugins"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2500
- tapOn: "Plugins"
- extendedWaitUntil:
    visible: "INSTALLED"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
# Hold on the list and read down it. Without this the shot spends most of its
# window on the Settings screen it passed through to get here.
- swipe:
    start: "50%, 74%"
    end: "50%, 44%"
    duration: 1100
- waitForAnimationToEnd:
    timeout: 3000
- swipe:
    start: "50%, 48%"
    end: "50%, 72%"
    duration: 1100
- waitForAnimationToEnd:
    timeout: 3000
# A swipe that starts on the header can open the Enable all / Disable all
# overflow. Caught half-open it is a clipped menu with a greyed item on top of
# the list; dismissed, the same space carries two more plugin rows, which are
# the actual proof of the claim.
- runFlow:
    when:
      visible: "Enable all"
    commands:
      - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 2000
- repeat:
    times: 5
    commands:
      - assertVisible: "INSTALLED"
      - waitForAnimationToEnd:
          timeout: 900
