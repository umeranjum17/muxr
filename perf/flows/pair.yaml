appId: com.trymuxr.app
tags:
  - perf
---
# First-run screen: "Paste link" sits under "Have a connect link?" and takes the pairing code.
- launchApp:
    appId: com.trymuxr.app
    clearState: false
- extendedWaitUntil:
    visible:
      text: 'Paste link|Other ways to connect|Enter pairing string|Pairing string|Enter another code'
    timeout: 40000
- runFlow:
    when:
      visible:
        text: 'Paste link'
    commands:
      - tapOn: 'Paste link'
      - inputText: '${PAIR_CODE}'
      - pressKey: Enter
      - tapOn:
          text: 'Connect'
          optional: true
- runFlow:
    when:
      visible:
        text: 'Other ways to connect|Enter pairing string|Pairing string|Enter another code'
    commands:
      - tapOn:
          text: 'Other ways to connect'
          optional: true
      - tapOn:
          text: 'Enter another code'
          optional: true
      - runFlow:
          when:
            notVisible:
              text: 'Pairing string'
          commands:
            - assertVisible: '^Enter pairing string$'
            - tapOn:
                text: '^Enter pairing string$'
      - extendedWaitUntil:
          visible:
            text: 'Pairing string'
          timeout: 40000
      - assertVisible: 'Pairing string'
      - tapOn: 'Pairing string'
      - eraseText: 120
      - inputText: '${PAIR_CODE}'
      - pressKey: Enter
- extendedWaitUntil:
    visible:
      text: '.*This phone can see.*|THIS PHONE WILL BE ABLE TO'
    timeout: 20000
- scrollUntilVisible:
    element:
      text: '^(Pair|Continue|Allow|Approve|Trust).*'
    direction: DOWN
- tapOn:
    text: '^(Pair|Continue|Allow|Approve|Trust).*'
- tapOn:
    text: 'CANCEL|Not now|Deny|Later'
    optional: true
- tapOn:
    text: 'CANCEL|Not now|Deny|Later'
    optional: true
- extendedWaitUntil:
    visible:
      text: '.*connected.*'
    timeout: 60000
