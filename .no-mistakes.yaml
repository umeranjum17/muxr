commands:
  prepare: node scripts/diagnostics/application/prepareManagedValidation.mjs
  test: yarn vitest run apps/mobile/sources/catalog/application/sessionSync.integration.spec.ts -t 'public-kit Pi consumer reconnect baseline'
test:
  instructions: |
    Run only the tests for the parts this change touches, plus the one user
    journey below. CI runs the full suite (`yarn run check`) on every pull
    request; do not run it here as well.

    1. Changed parts. List them with `git diff --name-only origin/main...HEAD`.
       - Source files: `yarn vitest related --run <changed source files>` runs
         every vitest flow that imports them.
       - A changed check script or self-check that
         scripts/diagnostics/application/runSuite.mjs lists: run that one entry
         as it is listed there (for example
         `node scripts/diagnostics/application/checkHostTakeover.mjs`).
       - A docs/evidence-only change (the rule in
         scripts/diagnostics/application/scopeDocsOnly.mjs) has no changed-part
         tests.
    2. The one journey: the configured `commands.test` baseline
       (sessionSync.integration.spec.ts, 'public-kit Pi consumer reconnect
       baseline'). It runs a real public-kit encrypted link and the actual
       mobile LinkFirstClient, catalog sync/store, activity acknowledgements
       and TerminalRoute against explicit protocol fixtures. Native storage
       and the terminal view are replaced at their platform boundaries. Run
       `commands.prepare` first; do not substitute true, skipped
       scripts/patches, injected dependencies or shared-cache symlinks. This
       baseline is not weakened or replaced.

    Keep private fixture keys, state, logs and dependencies ignored/outside
    commits. Any live Herdr run requires the allocated lab slot and
    fm-herdr-lab with an explicit named non-default session on every call,
    short private HOME/state, and verified default-session tripwire cleanup.
    Own the relay at port 0 and use its returned port. Never use the daily
    host/service, default Herdr session, relay 8792, credentials, paid
    providers or a phone/emulator without separate authority. Report unrun or
    failed tests honestly.

    For host, relay, or public-CLI behavior outside the journey, drive the
    mapped feature with the project-local verify-pockit skill
    (.agents/skills/verify-pockit/SKILL.md) and keep its feature map current
    when a feature changes. Its private-stack proof never substitutes for the
    journey and adds no runner.
