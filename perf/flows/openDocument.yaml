appId: com.trymuxr.app
tags:
  - perf
---
# Open the release gate's document fixture so the reading surface can be
# measured. Navigation only: the gate scripts the scroll and the swipes, and
# asserts the fixture text is really on screen before it resets a counter.
- tapOn:
    text: 'CANCEL|Not now|Deny|Later'
    optional: true
- tapOn:
    text: 'CANCEL|Not now|Deny|Later'
    optional: true
# The shared HeaderBackButton exposes `Back`; a plugin route labels its own
# header control `Go back` (`plugins.goBack`). The run can start on either.
- runFlow:
    when:
      visible:
        text: 'Back|Go back'
    commands:
      - tapOn:
          text: 'Back|Go back'
- extendedWaitUntil:
    visible:
      text: 'connected'
    timeout: 40000
- extendedWaitUntil:
    visible:
      text: 'LIVE'
    timeout: 40000
# `Files` is a plugin navigation item, and those render on the herd screen
# (`DeclarativeNavigationItems` in herd/presentation/MainView.tsx) -- not
# inside a session. It exists only because the gate now starts the fake herd
# with the real `code` plugin.
#
# The bare text match resolves to the item's label, which is not the clickable
# control, and the fixed title churn keeps the hierarchy changing so Maestro
# reads a tap that went nowhere as delivered. Tap the navigation control that
# contains that label, stop trusting the post-tap hierarchy change, and make
# the repository screen the only proof of delivery: an undelivered tap fails
# the wait and the bounded retry taps once more.
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          containsChild:
            text: 'Files'
          retryTapIfNoChange: false
      - extendedWaitUntil:
          visible:
            text: 'Repositories'
          timeout: 20000
# `Files` always opens the repository list (`files.browse`), even when the host
# has exactly one repository, so the repository row comes before any filename.
- extendedWaitUntil:
    visible:
      text: 'project'
    timeout: 20000
- tapOn:
    text: 'project'
- extendedWaitUntil:
    visible:
      text: 'perf-document.md'
    timeout: 20000
- tapOn:
    text: 'perf-document.md'
# The fixture's own numbered lines: proof the reading surface mounted with the
# document on it, not that some file list is still open.
- extendedWaitUntil:
    visible:
      text: 'PERF_LINE_.*'
    timeout: 20000
