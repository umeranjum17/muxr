name: desktop-appimage

# Build the Linux desktop app -- the AppImage a newcomer downloads to pair this
# computer without a terminal -- from a clean checkout and keep it as a workflow
# artifact for testing. This workflow never publishes: no GitHub release asset,
# no npm publish, no site change, no store upload. Public release waits on the
# maintainer's own testing.
#
# `yarn desktop:build:linux` is the exact local path (apps/desktop/scripts/build.mjs)
# and it already audits the shipped licenses and runs electron-builder with
# `--publish never`, so nothing here can publish even if it wanted to. A ready
# pull request builds the AppImage before it can land; workflow_dispatch rebuilds
# main on demand, without duplicating the pull request's build after every merge.
# A documentation- or evidence-only pull request skips the pack build but still
# reports success: scripts/diagnostics/application/scopeDocsOnly.mjs owns that
# rule, fail-open, with README.md/SKILL.md treated as non-docs.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  appimage:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scope guard below diffs the pull request against its merge base,
          # which a depth-1 checkout cannot compute. A workflow_dispatch run
          # has no base sha, so the rule is fail-open there: it builds.
          fetch-depth: 0
      # A documentation- or evidence-only change cannot produce this artifact.
      # The job still runs and reports success so it stays a check; its
      # expensive steps are the ones skipped.
      - name: Scope (a docs/evidence-only change cannot affect this job)
        id: scope
        run: node scripts/diagnostics/application/scopeDocsOnly.mjs "${{ github.event.pull_request.base.sha }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: 22
          cache: yarn
      - if: steps.scope.outputs.docs_only != 'true'
        run: yarn install --frozen-lockfile --non-interactive
      # Builds the host, relay, voice runtime and Electron main, audits every
      # shipped dependency's license, then packages the AppImage into
      # apps/desktop/release/. A copyleft or unknown license fails the build.
      - name: Build the AppImage (publish disabled)
        if: steps.scope.outputs.docs_only != 'true'
        run: yarn desktop:build:linux
      # The checksum travels beside the artifact so a downloader can verify the
      # exact file this run produced.
      - name: Write the AppImage's SHA-256 beside it
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          cd apps/desktop/release
          set -- ./*.AppImage
          appimage="$(basename "$1")"
          [ -f "$appimage" ] || { echo "no AppImage found" >&2; exit 1; }
          sha256sum "$appimage" > "$appimage.sha256"
          cat "$appimage.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.scope.outputs.docs_only != 'true'
        with:
          name: muxr-linux-appimage
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.AppImage.sha256
          if-no-files-found: error
