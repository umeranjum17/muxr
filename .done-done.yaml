# done-done project config. `done-done init` never overwrites this file.
# The app name finds this repo's evidence and receipts from every checkout.
app: "pockit"
# Approved written requirements: supervisor inbox 003 (two doors) and the
# ticket's existing Boat-flow requirement. Inbox 028 limits these rows to
# still-image-verifiable requirements and the fresh driver's exact filenames.
# Upstream rows name the journey that captures them (`journey:`, done-done 0.6.23), so
# it is enforced only on a claim citing that journey's run, and its capture is
# that journey's own filename. A claim about another journey never answers for it.
approved_requirements:
  - kind: spec
    name: native-connect-360-light
    requirement: 'the first screen must offer two branches - "My computer" and "Cloud machine (Boat)".'
    journey: two-doors
    capture: doors-360-1.0-light.png
  - kind: spec
    name: native-connect-360-dark
    requirement: 'the first screen must offer two branches - "My computer" and "Cloud machine (Boat)".'
    journey: two-doors
    capture: doors-360-1.0-dark.png
  - kind: spec
    name: native-connect-390-light
    requirement: 'the first screen must offer two branches - "My computer" and "Cloud machine (Boat)".'
    journey: two-doors
    capture: doors-390-1.0-light.png
  - kind: spec
    name: native-connect-390-dark
    requirement: 'the first screen must offer two branches - "My computer" and "Cloud machine (Boat)".'
    journey: two-doors
    capture: doors-390-1.0-dark.png
  - kind: spec
    name: pwa-connect-1280-light
    requirement: 'the first screen must offer two branches - "My computer" and "Cloud machine (Boat)".'
    journey: demo-first-run-pwa
    capture: web-connect-1280-1.0-light.png
  - kind: spec
    name: pwa-connect-1280-dark
    requirement: 'the first screen must offer two branches - "My computer" and "Cloud machine (Boat)".'
    journey: demo-first-run-pwa
    capture: web-connect-1280-1.0-dark.png
  - kind: spec
    name: native-boat-entry-390-light
    requirement: 'the cloud-machine option reaching the existing Boat flow.'
    journey: two-doors
    capture: boat-1-account-390-1.0-light.png
  - kind: spec
    name: Settings cloud machine action
    requirement: 'Settings shows a MACHINES section containing an "Add a cloud machine" row with the subtitle "Create a machine on Boat, then pair it with this device".'
    journey: cloud-machines
    capture: live-05-settings-action.png
  - kind: spec
    name: Settings cloud machine Boat destination
    requirement: 'The screen header reads "Cloud machine" and "Step 1 of 3", with "Connect your Boat account" and a "Connect Boat account" button visible.'
    journey: cloud-machines
    capture: live-06-boat-entry.png
  - kind: spec
    name: One machine list and shared actions
    requirement: 'Settings lists Desk and a separate machine whose visible hostname begins "box-node-" in the same MACHINES section. The hostname row shows "Linux • online", "Active", and a trash control, while Desk has its own trash control.'
    journey: cloud-machines
    capture: live-07-cloud-listed.png
  - kind: spec
    name: Switch to the paired computer
    requirement: 'Home shows "Desk" in its header with a green indicator and "connected".'
    journey: cloud-machines
    capture: live-08-desk-switched.png
  - kind: spec
    name: Switch back to the cloud machine
    requirement: 'Home shows a hostname beginning "box-node-" in its header with a green indicator and "connected".'
    journey: cloud-machines
    capture: live-09-cloud-switched-back.png
  - kind: spec
    name: Forget the cloud machine
    requirement: 'Settings shows Desk as its only machine row in the MACHINES section, with no additional box-node hostname row; the "Add a cloud machine" row remains visible.'
    journey: cloud-machines
    capture: live-12-cloud-forgotten.png
# This repo's coding agent, over agent in ~/.done-done/config.yaml (model, effort and the other agent settings stay there).
# agent: opencode

# Proof primitives: the repo's own check lanes, driven by done-done so the
# capture is tied to the exact commit. Prerequisites (run once per checkout):
# yarn install --frozen-lockfile --non-interactive && yarn build
# (dist/ is git-ignored; the self-check steps read it). CI's `fast` job runs
# `done-done run fast` and `done-done check` against the commit.
journeys:
  # The pull-request fast lane: typecheck, compiled self-checks, every
  # vitest flow, architecture policies. Same list as `yarn run check:fast`.
  fast:
    command: yarn run check:fast > $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}.log 2>&1
  # The full suite: everything above plus packaging, web export/serving,
  # install smoke and live-herdr e2e. Same list as `yarn run check`.
  suite:
    command: yarn run check > $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}.log 2>&1
    timeout: 30m
  # The release journey: install the release APK on an owned emulator (or the
  # test phone), run the lab host from the release's npm tarball (PHONE_PACKAGE),
  # pair, open an agent, attach again through pane churn, type and see output,
  # scroll the history back and forward fast, open Usage and come back, and
  # count one host alive. Fails on a host that wedges on a tree read (0.2.9)
  # or boots a second host from Usage (0.2.8). Writes release-build.json with
  # the build digests and the attach and scroll times; a stable release needs
  # its receipt and that result committed (scripts/release, docs/RELEASING.md).
  phone-attach:
    command: node scripts/diagnostics/application/checkPhoneAttach.mjs
    timeout: 30m
    core: true
  # A Claude pane under a plans folder wears that folder's account chip, on
  # the real phone, in a private Herdr lab. Runs by hand under the phone's
  # keeper lock with PHONE_SERIAL, PHONE_APK and the Herdr lab helper set.
  pane-account-chip:
    command: node .agents/skills/done-done-verify-pockit/features/paneAccountChipLab.mjs "$PHONE_APK" "$DONE_DONE_EVIDENCE_ROOT" "$PHONE_ATTACH_ROOT"
    timeout: 30m
  # The same chip on the host, no phone: a Claude pane muxr recorded on the
  # computer's own account, relaunched in the same pane on Work, reads Work in
  # herdr.tree (the chip) and plans.agent (the Out of room banner and Move).
  # Writes gate.log and steps.json. Needs `yarn build` and HERDR_LAB_HELPER
  # (HERDR_LAB_SESSION names the lab session; the lab link provisions it and
  # tears it down).
  pane-account-host:
    command: node .agents/skills/done-done-verify-pockit/features/paneAccountHostLab.mjs "$DONE_DONE_EVIDENCE_ROOT" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 10m
  # Self-naming on the host, no phone: a lane alone in the lead's workspace
  # runs the real `muxr name --workspace`; the workspace keeps its label, only
  # the lane's own tab is named, and herdr.tree carries a path-labelled
  # workspace as Herdr has it. Writes gate.log and steps.json. Needs `yarn
  # build` and HERDR_LAB_HELPER.
  workspace-name-host:
    command: node .agents/skills/done-done-verify-pockit/features/workspaceNameHostLab.mjs "$DONE_DONE_EVIDENCE_ROOT" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 10m
  # The npm latest gate on a real stable release: release.yml's own gate step
  # command, the release's sealed manifest and npm tarball from GitHub, and a
  # scratch clone carrying a stand-in journey receipt for that exact build. A
  # push, an unchecked or mismatched captain_tested input, or a missing receipt
  # leaves the publish step skipped; only the hand run naming the tested
  # version with the receipt reaches `npm publish --tag latest`. Publishes
  # nothing. Needs gh read access to the public releases.
  release-latest-gate:
    command: node .agents/skills/done-done-verify-pockit/features/releaseLatestGateLab.mjs "$DONE_DONE_EVIDENCE_ROOT" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 10m
  # The stable gate on a release whose journey ran its x86_64 twin: the
  # release's sealed APK checked against the twin built from its tag
  # (TWIN_APK, its build record beside it), the arm64 APK as its own twin
  # refused, then the gate and a push's npm latest dry run on the receipts at
  # HEAD. Publishes nothing. Needs gh read access to the public releases.
  release-twin-gate:
    command: node .agents/skills/done-done-verify-pockit/features/releaseTwinGateLab.mjs "$DONE_DONE_EVIDENCE_ROOT" "${TWIN_VERSION:-0.2.12}" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 10m
  # The app upgrade on the real phone: the previous release installed and
  # paired, Theme and Text size set, the candidate installed over it with
  # `install -r`, the settings read back, an agent's terminal opened, then a
  # clean install paired again. Runs by hand under the phone's keeper lock with
  # UPGRADE_FROM_APK and UPGRADE_TO_APK set (see the upgrade-keeps-state feature).
  upgrade:
    command: node scripts/diagnostics/application/checkUpgradeJourney.mjs
    upgrade: true
    timeout: 30m
  # The published package: packs the release tree, installs it, and starts the
  # packed host.js as the usage ledger child on a lab Codex store. The 0.2.8
  # bundle re-ran the host there instead, so every Usage tab read
  # "Local activity could not be measured".
  package-smoke:
    command: node scripts/diagnostics/application/checkPackageSmoke.mjs > $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}.log 2>&1
    timeout: 10m
  # Workspace and pane names on the phone: a lab Herdr where every lane
  # self-names in one shared workspace (the last as ssh-ed25519), the real
  # herdr.task-titles hook titling a Pi stand-in, and the release app paired to
  # a private lab host. Home and Panes must read the workspace's own name and
  # each pane's task. Runs by hand: the caller provisions the Herdr lab session
  # (HERDR_LAB_HELPER, HERDR_LAB_SESSION, HERDR_LAB_PREPROVISIONED=1) and sets
  # MUXR_LAB_APK, MUXR_LAB_ROOT and MUXR_TASK_TITLES_PLUGIN; with
  # MUXR_LAB_SERIAL it drives that phone under its keeper lock. See
  # .agents/skills/done-done-verify-pockit/features/agent-naming.md.
  workspace-name:
    command: node .agents/skills/done-done-verify-pockit/features/workspaceNameLab.mjs "$MUXR_LAB_APK" "$DONE_DONE_EVIDENCE_ROOT" "$MUXR_LAB_ROOT" "$PWD" "$MUXR_TASK_TITLES_PLUGIN"
  # Board alerts on Android: the release app on an owned emulator, paired to a
  # private lab host, gets a POST /v1/notify alert over the live link and shows
  # it in the shade once its level is all (notify.md, notify-android-link).
  # Runs by hand under the shared emulator lock; MUXR_LAB_APK is a release
  # build of this commit, MUXR_LAB_AVD_HOME a task-owned emulator home.
  board-alert:
    command: node .agents/skills/done-done-verify-pockit/features/boardAlertLab.mjs "$MUXR_LAB_APK" "$DONE_DONE_EVIDENCE_ROOT" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 30m
  # Home's out-of-date Herdr card on Android for an old Herdr server still
  # running after the binary was updated (home-herdr-missing.md,
  # old-server-signal): the fake stack answers protocol 21, then 22, and Home
  # recovers with no tap. Runs by hand under the shared emulator lock;
  # MUXR_LAB_APK is a release build of this commit.
  home-herdr-outdated:
    command: node .agents/skills/done-done-verify-pockit/features/homeHerdrOutdatedLab.mjs "$MUXR_LAB_APK" "$DONE_DONE_EVIDENCE_ROOT" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 30m
  # Home's version line and Settings > About on Android (home-version-line.md):
  # the fake stack first on this checkout's version, then announcing 0.2.10;
  # the foot of Home and the Version row read both versions and the mismatch
  # hint. Runs by hand under the shared emulator lock; MUXR_LAB_APK is a
  # release build of this commit.
  home-version-line:
    command: node .agents/skills/done-done-verify-pockit/features/homeVersionLineLab.mjs "$MUXR_LAB_APK" "$DONE_DONE_EVIDENCE_ROOT" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 30m
  # Home's Right now card saying what the herd is doing (home-quota-row.md,
  # herd-working and its siblings): the release APK on an owned emulator, paired
  # to a private lab host over a fake Herdr with one agent whose lifecycle the
  # journey holds — working, waiting, stopped, ready and nothing at 360/390/445/
  # 270 dp, font 1.0 and 2.0, light and dark — then the installed PWA at the same
  # widths and on desktop 1280/1440. Runs by hand under the shared emulator lock;
  # MUXR_LAB_APK is a release build of this commit, MUXR_LAB_WEB a lab web export
  # of it (EXPO_PUBLIC_MUXR_LAB_PAIR=1 yarn web:export), MUXR_LAB_AVD_HOME a
  # task-owned emulator home.
  home-herd-sentence:
    command: bash .agents/skills/done-done-verify-pockit/features/homeHerdSentenceJourney.sh "$MUXR_LAB_APK" "$MUXR_LAB_WEB" "$DONE_DONE_EVIDENCE_ROOT" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 60m
  # The same version line and Settings row in the installed PWA
  # (home-version-line.md): phone widths 360/390/445/270 and font 2.0, desktop
  # 1280/1440, dark and light. MUXR_LAB_WEB is a lab web export of this commit
  # (EXPO_PUBLIC_MUXR_LAB_PAIR=1 yarn web:export, optionally with a
  # MUXR_RELEASE_VERSION pre-release identity).
  home-version-line-pwa:
    command: scripts/diagnostics/application/withPrivateXvfb.sh bash .agents/skills/done-done-verify-pockit/features/homeVersionLinePwaCells.sh "$MUXR_LAB_WEB" "$DONE_DONE_EVIDENCE_ROOT" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 30m
  # The first screen an unpaired browser gets (pwa-demo-first-run.md): no grant
  # in a fresh profile, so the sample herd, one sample conversation and the
  # Connect a machine step are what opens, then the two doors, My computer's
  # steps and the Boat door's browser notice (two-doors-first-run.md) - at 270
  # dp/text 2.0 and 360/390/445/1280/1440 dp, light and dark, at rest and
  # scrolled, plus a sampled clip from first open into the My computer pair step. MUXR_LAB_WEB is a web export of this commit
  # (`yarn web:export`); nothing pairs, so no relay or host is involved.
  demo-first-run-pwa:
    command: scripts/diagnostics/application/withPrivateXvfb.sh bash .agents/skills/done-done-verify-pockit/features/demoFirstRunPwaLab.sh "$MUXR_LAB_WEB" "$DONE_DONE_EVIDENCE_ROOT" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 30m
  # Home with the internet up and the Tailscale path to the computer gone
  # (home-tailscale-off.md): the pairing offer names this desktop's Tailscale
  # address, forwarded to the lab relay; closing the forwarder must bring
  # "Tailscale is off on this phone" with Open Tailscale, and only airplane
  # mode "You're offline". Runs by hand under the shared emulator lock;
  # MUXR_LAB_APK is a release build of this commit, MUXR_LAB_AVD_HOME a
  # task-owned emulator home.
  home-tailscale-off:
    command: node .agents/skills/done-done-verify-pockit/features/homeTailscaleOffLab.mjs "$MUXR_LAB_APK" "$DONE_DONE_EVIDENCE_ROOT" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 30m
  # The pane switcher on Android: the release app on an owned emulator, paired
  # to the fake stack (three tabs), opened from an agent's pane counter at
  # 390 dp light and dark and 270 dp (pane-switcher.md). Runs by hand under the
  # shared emulator lock; MUXR_LAB_APK is a release build of this commit,
  # MUXR_LAB_AVD_HOME a task-owned emulator home.
  pane-switcher:
    command: node .agents/skills/done-done-verify-pockit/features/paneSwitcherLab.mjs --apk "$MUXR_LAB_APK" --evidence "$DONE_DONE_EVIDENCE_ROOT" --avd-home "$MUXR_LAB_AVD_HOME" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 30m
  # Terminal key and quick-actions targets on Android: the release app on an
  # owned emulator, paired to the fake stack (three tabs), measures every key
  # and the quick-actions control at 48 dp and the control clear of the tabs,
  # at 390 and 270 dp, light and dark, and 2x text (terminal-key-targets.md).
  # Runs by hand under the shared emulator lock; MUXR_LAB_APK is a release
  # build of this commit, MUXR_LAB_AVD_HOME a task-owned emulator home.
  key-targets:
    command: node .agents/skills/done-done-verify-pockit/features/keyRowLab.mjs --apk "$MUXR_LAB_APK" --evidence "$DONE_DONE_EVIDENCE_ROOT" --avd-home "$MUXR_LAB_AVD_HOME" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 30m
  # The composer's send feedback on Android: the release app over a stub-backed
  # Claude Code in a provisioned Herdr lab (HERDR_LAB_PREPROVISIONED=1), a
  # delivered send and a refused one retried from its chip, recorded at 390 dp
  # (send-feedback.md). Runs by hand under the shared emulator lock with
  # MUXR_LAB_APK a release build of this commit.
  send-feedback:
    command: node .agents/skills/done-done-verify-pockit/features/sendFeedbackNativeLab.mjs "$MUXR_LAB_APK" "$DONE_DONE_EVIDENCE_ROOT" "$(mktemp -d "$HOME/.cache/fms/mxsf.XXXX")" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 30m
  # Tap-to-confirm and tap-to-echo of a prompt over the lab link, idle, mid-turn,
  # beside busy agents and in a retitling fleet (send-feedback.md, send-latency);
  # in a provisioned Herdr lab, after yarn build.
  send-latency:
    command: EVIDENCE="$DONE_DONE_EVIDENCE_ROOT" node --input-type=module -e "$(cat .agents/skills/done-done-verify-pockit/features/sendLatencyLab.mjs)" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 20m
  # Phone-side history in a fullscreen Claude Code pane on Android: the release
  # app fresh-paired to the Latest lab, then a slow drag back, a fling back and
  # Latest, each screen's visible MARK range in proof.log (terminal-latest.md,
  # latest-local). Runs by hand under the shared emulator lock with
  # MUXR_LAB_APK a release build of this commit, MUXR_LAB_SERIAL an owned
  # emulator and a provisioned Herdr lab (HERDR_LAB_PREPROVISIONED=1).
  # LINES=1200 STUB_LPS=100 WALK=30 walks the history instead and logs every
  # hole in it (terminal-latest.md); DENSITY=640 walks it on the 270 dp
  # reference phone, DENSITY=420 at 411 dp.
  terminal-scroll-local:
    command: bash .agents/skills/done-done-verify-pockit/features/terminalScrollLocalLab.sh "$MUXR_LAB_APK" "$DONE_DONE_EVIDENCE_ROOT"
    timeout: 20m
  # Every alert and choice popup on Android is the shared app action sheet:
  # Add attachment, an agent card's and a tab's actions, per width, text size
  # and theme, plus tap-outside, swipe-down and Files reaching the system
  # picker (action-sheet.md). Runs by hand under the shared emulator lock;
  # MUXR_LAB_APK is a release build of this commit, MUXR_LAB_AVD_HOME a
  # task-owned emulator home.
  # A live Claude conversation moves A to B and back from Pane actions on an
  # owned emulator, over a lab host on a private Herdr with two stand-in
  # accounts (see the plan-move feature). Runs by hand under the emulator lock
  # with MUXR_LAB_APK and the Herdr lab helper set; each run takes a fresh lab root.
  plan-move:
    command: node .agents/skills/done-done-verify-pockit/features/planMoveLab.mjs "$MUXR_LAB_APK" "$DONE_DONE_EVIDENCE_ROOT" "$(mktemp -d "$HOME/.cache/fms/mxmv.XXXX")" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 30m
  # A new Boat cloud computer is set up over SSH and the phone lands on Home,
  # with no tailnet: the release app on an owned 390 dp emulator, the Boat lab
  # with its stand-in computer (sshd + this checkout's muxr in a namespace),
  # Create cloud computer and no other tap in muxr (cloud-computer-onboarding,
  # ssh-route). Runs by hand under the emulator lock and a provisioned Herdr
  # lab (HERDR_LAB_HELPER, HERDR_LAB_SESSION); MUXR_LAB_APK is a release build
  # of this commit with EXPO_PUBLIC_MUXR_BOAT_API pointing at
  # 127.0.0.1:$BOAT_LAB_PORT, MUXR_LAB_AVD_HOME a task-owned emulator home;
  # CLOUD_LAB_DP, CLOUD_LAB_FONT and CLOUD_LAB_THEME pick the view (390, 1.0, light).
  cloud-setup:
    command: node .agents/skills/done-done-verify-pockit/features/cloudSetupLab.mjs --apk "$MUXR_LAB_APK" --evidence "$DONE_DONE_EVIDENCE_ROOT" --avd-home "$MUXR_LAB_AVD_HOME" --port "$BOAT_LAB_PORT" --machine "$(mktemp -d "$HOME/.cache/fms/mxcs.XXXX")" --dp "${CLOUD_LAB_DP:-390}" --font "${CLOUD_LAB_FONT:-1.0}" --theme "${CLOUD_LAB_THEME:-light}" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 30m
  # The saved SSH computer survives cloud → Desk → cloud and a phone relaunch.
  # Same isolated sshd/Boat-lab prerequisites as cloud-setup; no provider spend.
  ssh-computer-return:
    command: node .agents/skills/done-done-verify-pockit/features/cloudSetupLab.mjs --apk "$MUXR_LAB_APK" --evidence "$DONE_DONE_EVIDENCE_ROOT" --avd-home "$MUXR_LAB_AVD_HOME" --port "$BOAT_LAB_PORT" --machine "$MUXR_SSH_LAB_ROOT" --switch-route > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 30m
  # The same set-up on a real Boat machine (it costs money: only once approved):
  # the Boat lab as the key proxy in front of Boat, the key read in place from
  # BOAT_LIVE_KEY_FILE (never on the phone), Home connected over SSH, and every
  # machine the run created removed (cloud-computer-onboarding, step 8).
  # Real Boat lifecycle from Settings, under the keeper lock and a preprovisioned
  # non-default Herdr lab. Requires a matching MUXR_LAB_APK, private MX_LIVE_ROOT,
  # and explicitly approved BOAT_LAB_UPSTREAM / BOAT_LAB_KEY_FILE; costs money.
  cloud-machines:
    command: node .agents/skills/done-done-verify-pockit/features/cloudMachinesNativeLab.mjs --apk "$MUXR_LAB_APK" --evidence "$DONE_DONE_EVIDENCE_ROOT" --port "$BOAT_LAB_PORT" --upstream "$BOAT_LAB_UPSTREAM" --key-file "$BOAT_LAB_KEY_FILE" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 25m
  cloud-boat:
    command: node .agents/skills/done-done-verify-pockit/features/cloudSetupLab.mjs --apk "$MUXR_LAB_APK" --evidence "$DONE_DONE_EVIDENCE_ROOT" --avd-home "$MUXR_LAB_AVD_HOME" --port "$BOAT_LAB_PORT" --upstream "${BOAT_LIVE_API:-https://boat.dev/api/v1}" --key-file "$BOAT_LIVE_KEY_FILE" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 30m
  # The approved one-machine real Boat SSH return, with ownership-scoped cleanup.
  ssh-boat-return:
    command: node .agents/skills/done-done-verify-pockit/features/cloudSetupLab.mjs --apk "$MUXR_LAB_APK" --evidence "$DONE_DONE_EVIDENCE_ROOT" --avd-home "$MUXR_LAB_AVD_HOME" --port "$BOAT_LAB_PORT" --upstream "${BOAT_LIVE_API:-https://boat.dev/api/v1}" --key-file "$BOAT_LIVE_KEY_FILE" --switch-route > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 30m
  # The same real run going on to the screen for sign-ins (cloud-computer-onboarding,
  # screen-for-sign-ins, step 9): Computer's Set it up for me on the new machine,
  # then Firefox on a sign-in page tapped and typed into; the machine is removed.
  cloud-boat-screen:
    command: node .agents/skills/done-done-verify-pockit/features/cloudSetupLab.mjs --apk "$MUXR_LAB_APK" --evidence "$DONE_DONE_EVIDENCE_ROOT" --avd-home "$MUXR_LAB_AVD_HOME" --port "$BOAT_LAB_PORT" --upstream "${BOAT_LIVE_API:-https://boat.dev/api/v1}" --key-file "$BOAT_LIVE_KEY_FILE" --screen --hold "${CLOUD_LAB_HOLD:-0}" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 60m
  # The size step's Add a screen for sign-ins switch, off by default, turned on
  # and off at 360, 390, 445 and 270 dp, font 1.0 and 2.0, light and dark, on the lab
  # account; nothing is created (cloud-computer-onboarding, screen-for-sign-ins).
  # MUXR_LAB_APK is a release build with
  # EXPO_PUBLIC_MUXR_BOAT_API=http://127.0.0.1:$BOAT_LAB_PORT/api/v1.
  cloud-screen-switch:
