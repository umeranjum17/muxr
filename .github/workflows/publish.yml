name: publish npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to publish
        required: true
        type: string

concurrency:
  group: npm-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'umeranjum17/muxr'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Match package version to the release tag
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          release_tag="${{ github.event.release.tag_name || inputs.tag }}"
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "v$version" = "$release_tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: yarn run pack
      - name: Check whether this immutable version already exists
        id: registry
        run: |
          if npm view "@trymuxr/cli@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install npm with trusted publishing support
        if: steps.registry.outputs.exists != 'true'
        run: npm install --global npm@11.6.2
      - name: Publish with npm trusted publishing
        if: steps.registry.outputs.exists != 'true'
        run: npm publish ./dist-npm --access public --provenance
