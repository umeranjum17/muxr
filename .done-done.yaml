# done-done project config. `done-done init` never overwrites this file.
# The app name finds this repo's evidence and receipts from every checkout.
app: "pockit"
# This repo's coding agent, over agent in ~/.done-done/config.yaml (model, effort and the other agent settings stay there).
# agent: opencode

# Proof primitives: the repo's own check lanes, driven by done-done so the
# capture is tied to the exact commit. Prerequisites (run once per checkout):
# yarn install --frozen-lockfile --non-interactive && yarn build
# (dist/ is git-ignored; the self-check steps read it). CI's `fast` job runs
# `done-done run fast` and `done-done check` against the commit.
journeys:
  # The pull-request fast lane: typecheck, compiled self-checks, every
  # vitest flow, architecture policies. Same list as `yarn run check:fast`.
  fast:
    command: yarn run check:fast > $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}.log 2>&1
  # The full suite: everything above plus packaging, web export/serving,
  # install smoke and live-herdr e2e. Same list as `yarn run check`.
  suite:
    command: yarn run check > $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}.log 2>&1
    timeout: 30m
  # The release journey: install the release APK on an owned emulator (or the
  # test phone), run the lab host from the release's npm tarball (PHONE_PACKAGE),
  # pair, open an agent, attach again through pane churn, type and see output,
  # scroll the history back and forward fast, open Usage and come back, and
  # count one host alive. Fails on a host that wedges on a tree read (0.2.9)
  # or boots a second host from Usage (0.2.8). Writes release-build.json with
  # the build digests and the attach and scroll times; a stable release needs
  # its receipt and that result committed (scripts/release, docs/RELEASING.md).
  phone-attach:
    command: node scripts/diagnostics/application/checkPhoneAttach.mjs
    timeout: 30m
    core: true
  # A Claude pane under a plans folder wears that folder's account chip, on
  # the real phone, in a private Herdr lab. Runs by hand under the phone's
  # keeper lock with PHONE_SERIAL, PHONE_APK and the Herdr lab helper set.
  pane-account-chip:
    command: node .agents/skills/done-done-verify-pockit/features/paneAccountChipLab.mjs "$PHONE_APK" "$DONE_DONE_EVIDENCE_ROOT" "$PHONE_ATTACH_ROOT"
    timeout: 30m
  # The app upgrade on the real phone: the previous release installed and
  # paired, Theme and Text size set, the candidate installed over it with
  # `install -r`, the settings read back, an agent's terminal opened, then a
  # clean install paired again. Runs by hand under the phone's keeper lock with
  # UPGRADE_FROM_APK and UPGRADE_TO_APK set (see the upgrade-keeps-state feature).
  upgrade:
    command: node scripts/diagnostics/application/checkUpgradeJourney.mjs
    upgrade: true
    timeout: 30m
  # The published package: packs the release tree, installs it, and starts the
  # packed host.js as the usage ledger child on a lab Codex store. The 0.2.8
  # bundle re-ran the host there instead, so every Usage tab read
  # "Local activity could not be measured".
  package-smoke:
    command: node scripts/diagnostics/application/checkPackageSmoke.mjs > $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}.log 2>&1
    timeout: 10m
  # Workspace and pane names on the phone: a lab Herdr where every lane
  # self-names in one shared workspace (the last as ssh-ed25519), the real
  # herdr.task-titles hook titling a Pi stand-in, and the release app paired to
  # a private lab host. Home and Panes must read the workspace's own name and
  # each pane's task. Runs by hand: the caller provisions the Herdr lab session
  # (HERDR_LAB_HELPER, HERDR_LAB_SESSION, HERDR_LAB_PREPROVISIONED=1) and sets
  # MUXR_LAB_APK, MUXR_LAB_ROOT and MUXR_TASK_TITLES_PLUGIN; with
  # MUXR_LAB_SERIAL it drives that phone under its keeper lock. See
  # .agents/skills/done-done-verify-pockit/features/agent-naming.md.
  workspace-name:
    command: node .agents/skills/done-done-verify-pockit/features/workspaceNameLab.mjs "$MUXR_LAB_APK" "$DONE_DONE_EVIDENCE_ROOT" "$MUXR_LAB_ROOT" "$PWD" "$MUXR_TASK_TITLES_PLUGIN"
  # Board alerts on Android: the release app on an owned emulator, paired to a
  # private lab host, gets a POST /v1/notify alert over the live link and shows
  # it in the shade once its level is all (notify.md, notify-android-link).
  # Runs by hand under the shared emulator lock; MUXR_LAB_APK is a release
  # build of this commit, MUXR_LAB_AVD_HOME a task-owned emulator home.
  board-alert:
    command: node .agents/skills/done-done-verify-pockit/features/boardAlertLab.mjs "$MUXR_LAB_APK" "$DONE_DONE_EVIDENCE_ROOT" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 30m
  # The pane switcher on Android: the release app on an owned emulator, paired
  # to the fake stack (three tabs), opened from an agent's pane counter at
  # 390 dp light and dark and 270 dp (pane-switcher.md). Runs by hand under the
  # shared emulator lock; MUXR_LAB_APK is a release build of this commit,
  # MUXR_LAB_AVD_HOME a task-owned emulator home.
  pane-switcher:
    command: node .agents/skills/done-done-verify-pockit/features/paneSwitcherLab.mjs --apk "$MUXR_LAB_APK" --evidence "$DONE_DONE_EVIDENCE_ROOT" --avd-home "$MUXR_LAB_AVD_HOME" > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 30m
  # Phone-side history in a fullscreen Claude Code pane on Android: the release
  # app fresh-paired to the Latest lab, then a slow drag back, a fling back and
  # Latest, each screen's visible MARK range in proof.log (terminal-latest.md,
  # latest-local). Runs by hand under the shared emulator lock with
  # MUXR_LAB_APK a release build of this commit, MUXR_LAB_SERIAL an owned
  # emulator and a provisioned Herdr lab (HERDR_LAB_PREPROVISIONED=1).
  terminal-scroll-local:
    command: bash .agents/skills/done-done-verify-pockit/features/terminalScrollLocalLab.sh "$MUXR_LAB_APK" "$DONE_DONE_EVIDENCE_ROOT"
    timeout: 20m
  # Every alert and choice popup on Android is the shared app action sheet:
  # Add attachment, an agent card's and a tab's actions, per width, text size
  # and theme, plus tap-outside, swipe-down and Files reaching the system
  # picker (action-sheet.md). Runs by hand under the shared emulator lock;
  # MUXR_LAB_APK is a release build of this commit, MUXR_LAB_AVD_HOME a
  # task-owned emulator home.
  action-sheet:
    command: node .agents/skills/done-done-verify-pockit/features/actionSheetLab.mjs --apk "$MUXR_LAB_APK" --evidence "$DONE_DONE_EVIDENCE_ROOT" --avd-home "$MUXR_LAB_AVD_HOME" --interact > "$DONE_DONE_EVIDENCE_ROOT/journey.out" 2>&1
    timeout: 30m
