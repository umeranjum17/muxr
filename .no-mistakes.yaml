commands:
  prepare: node scripts/diagnostics/application/prepareManagedValidation.mjs && yarn build
  test: yarn vitest run --root .
test:
  instructions: |
    Run commands.prepare, then commands.test once. This is the same retained
    Vitest sweep that scripts/diagnostics/application/runSuite.mjs runs in CI;
    do not run separate architecture or pairing copies of tests in that sweep.
    The public-kit Pi consumer reconnect baseline is included unchanged.
    Legacy tests whose deletion the constraints floor refuses remain in this
    partial prune; do not silently exclude them or weaken the guard.

    For changed standalone check scripts or self-checks listed by runSuite.mjs,
    run that entry as listed there. CI runs the full suite (`yarn run check`)
    on every pull request; do not repeat the full suite here as well.
    A docs/evidence-only change (the scopeDocsOnly.mjs rule) needs no additional
    changed-part tests.

    The consumer reconnect journey runs a real public-kit encrypted link and
    the actual mobile LinkFirstClient, catalog sync/store, activity
    acknowledgements and TerminalRoute against explicit protocol fixtures.
    Native storage and the terminal view are replaced at platform boundaries.
    Do not substitute true, skipped scripts/patches, injected dependencies or
    shared-cache symlinks. This baseline is not weakened or replaced, and
    fixture tests do not replace native rendering or live backend validation.

    Keep private fixture keys, state, logs and dependencies ignored/outside
    commits. Any live Herdr run requires the allocated lab slot and
    fm-herdr-lab with an explicit named non-default session on every call,
    short private HOME/state, and verified default-session tripwire cleanup.
    Own the relay at port 0 and use its returned port. Never use the daily
    host/service, default Herdr session, relay 8792, credentials, paid
    providers or a phone/emulator without separate authority. Report unrun or
    failed tests honestly.

    For host, relay, or public-CLI behavior outside the journey, drive the
    mapped feature with the project-local done-done-verify-pockit skill
    (.agents/skills/done-done-verify-pockit/SKILL.md) and keep its feature map current
    when a feature changes. Its private-stack proof never substitutes for the
    journey and adds no runner.
