name: mobile Android production promotion

on:
  workflow_dispatch:
    inputs:
      android_internal_run_id:
        description: Successful Android internal workflow run for this exact main commit
        required: true
        type: string
      version:
        description: Tested marketing version, for example 0.1.13
        required: true
        type: string
      android_version_code:
        description: Exact versionCode completed on Play Internal
        required: true
        type: string
      rollout_percent:
        description: Initial Google Play production rollout
        required: true
        default: "10"
        type: choice
        options: ["10", "25", "50", "100"]

concurrency:
  group: mobile-android-production-${{ inputs.android_version_code }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tested build identifiers
        env:
          INTERNAL_RUN_ID: ${{ inputs.android_internal_run_id }}
          APP_VERSION: ${{ inputs.version }}
          ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$INTERNAL_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ANDROID_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]

  provenance:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Prove the Android internal run and tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
          INTERNAL_RUN_ID: ${{ inputs.android_internal_run_id }}
          APP_VERSION: ${{ inputs.version }}
          ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INTERNAL_RUN_ID" > "$RUNNER_TEMP/internal-run.json"
          jq -e --arg sha "$GITHUB_SHA" '
            .event == "workflow_dispatch"
            and .name == "mobile Android internal"
            and .head_branch == "main"
            and .head_sha == $sha
            and .status == "completed"
            and .conclusion == "success"
          ' "$RUNNER_TEMP/internal-run.json"
          mkdir -p "$RUNNER_TEMP/internal-artifact"
          gh run download "$INTERNAL_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name android-internal \
            --dir "$RUNNER_TEMP/internal-artifact"
          jq -e \
            --arg sha "$GITHUB_SHA" \
            --arg version "$APP_VERSION" \
            --arg android "$ANDROID_VERSION_CODE" '
              .platform == "ANDROID"
              and .gitCommitHash == $sha
              and .appVersion == $version
              and .appBuildVersion == $android
              and .bundleIdentifier == "com.trymuxr.app"
              and .submittedToInternal == true
              and (.artifactSha256 | test("^[0-9a-f]{64}$"))
            ' "$RUNNER_TEMP/internal-artifact/result.json"
          mapfile -t bundles < <(find "$RUNNER_TEMP/internal-artifact" -type f -name '*.aab')
          test "${#bundles[@]}" -eq 1
          test "$(sha256sum "${bundles[0]}" | cut -d ' ' -f 1)" = "$(jq -r .artifactSha256 "$RUNNER_TEMP/internal-artifact/result.json")"

  promote:
    needs: [validate, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      APP_VERSION: ${{ inputs.version }}
      ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
      ROLLOUT_PERCENT: ${{ inputs.rollout_percent }}
    steps:
      - name: Validate Play credential
        env:
          HAS_PLAY_CREDENTIAL: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: test "$HAS_PLAY_CREDENTIAL" = true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Promote tested build to Play Production
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          bundle exec fastlane android verify_internal
          bundle exec fastlane android promote_production

  summary:
    if: always()
    needs: [validate, provenance, promote]
    runs-on: ubuntu-latest
    steps:
      - name: Write production promotion summary
        env:
          RESULT: ${{ needs.promote.result }}
          APP_VERSION: ${{ inputs.version }}
          ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
        run: |
          {
            echo "## Android production promotion"
            echo
            echo "Version: $APP_VERSION"
            echo "Android versionCode: $ANDROID_VERSION_CODE"
            echo "Result: $RESULT"
            echo "Source: exact Play Internal release; no rebuild"
          } >> "$GITHUB_STEP_SUMMARY"
