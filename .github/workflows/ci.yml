name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn build
      - name: Production web export (self-host, origin-clean)
        run: yarn web:export:selfhost
      - name: Web export checks against dist (manifest, budget, no marketing origin)
        run: node scripts/diagnostics/application/checkWebExport.mjs
      - name: Live web serving delivery (relay + static server over HTTP)
        run: node scripts/diagnostics/application/checkWebServing.mjs
      - name: Export chain isolation (canary export + full-dist secret scan)
        run: node scripts/diagnostics/application/checkExportIsolation.mjs
      - name: Demo replay loop (production /demo in headless Chromium)
        run: node scripts/diagnostics/application/checkDemoFlow.mjs
      - name: Full suite (typecheck, crypto, pairing, e2e, package smoke, purity, secrets, architecture)
        run: yarn run check
      - name: Core purity guard
        run: node scripts/diagnostics/application/checkCorePurity.mjs
