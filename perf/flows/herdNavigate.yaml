appId: com.trymuxr.app
tags:
  - perf
---
# Mount and unmount churn, which is where a starved JS thread shows up as a
# screen that never comes back: attach an agent's terminal, drag its scrollback
# top to bottom, detach, walk the plugin tabs, leave the app and return.
#
# Each pass starts by putting the app back on the herd, because a relaunch
# restores whatever screen it was last on.
- repeat:
    times: 4
    commands:
      # Android and the app both raise one-off prompts (live updates, battery,
      # notifications); none of them are what this flow measures, and they queue
      # one behind another.
      - tapOn:
          text: 'CANCEL|Not now|Deny|Later'
          optional: true
      - tapOn:
          text: 'CANCEL|Not now|Deny|Later'
          optional: true
      # A previous pass may have left a terminal open, with its keyboard up: an
      # open IME eats the back that was meant to leave the route.
      - hideKeyboard
      # `Back` is the label the shared HeaderBackButton exposes.
      - runFlow:
          when:
            visible:
              text: 'Back'
          commands:
            - tapOn:
                text: 'Back'
      # A relaunch reconnects and refetches the herd before anything is live.
      - extendedWaitUntil:
          visible:
            text: 'connected'
          timeout: 40000
      - extendedWaitUntil:
          visible:
            text: 'LIVE'
          timeout: 40000
      # A live card by the label the app publishes for it
      # (`agentAccessibilityLabel`: title, state, identity). The herd reorders
      # as titles churn, so a fixed point opens whatever drifted under it.
      - tapOn:
          text: '.*\. (Idle|Working|Starting|Needs you|Done|Failed|Offline).*\. .*'
      - tapOn:
          text: 'CANCEL|Not now|Deny|Later'
          optional: true
      # The terminal screen's own furniture. The terminal itself is a native
      # surface with no accessibility text, so this label is the assertion that
      # the pass really reached a terminal; the attach itself is proven from
      # the host's journal.
      - extendedWaitUntil:
          visible:
            text: 'Show terminal controls'
          timeout: 20000
      # A terminal tap opens the IME by design, which changes the bounds every
      # swipe below lands in.
      - hideKeyboard
      - repeat:
          times: 8
          commands:
            - swipe:
                start: 50%, 22%
                end: 50%, 72%
                duration: 90
            - swipe:
                start: 50%, 72%
                end: 50%, 22%
                duration: 90
      - hideKeyboard
      - tapOn:
          text: 'Back'
      - extendedWaitUntil:
          visible:
            text: 'LIVE'
          timeout: 20000
      - tapOn:
          text: 'Usage'
          optional: true
      # The `code` plugin is loaded from the gate's fixture plugin root, so
      # Files is a real tab now and its absence is a failure, not a no-op.
      - tapOn:
          text: 'Files'
      - extendedWaitUntil:
          visible:
            text: 'perf-document.md|All Files|Changes|project'
          timeout: 20000
      - tapOn:
          text: 'Panes'
          optional: true
      # Panes pushes a screen of its own; the tabs are behind it.
      - runFlow:
          when:
            visible:
              text: 'Back'
          commands:
            - tapOn:
                text: 'Back'
      - tapOn:
          text: 'Machine'
          optional: true
      - pressKey: Home
      - launchApp:
          appId: com.trymuxr.app
