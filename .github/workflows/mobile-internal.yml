name: mobile internal testing

on:
  workflow_dispatch:
    inputs:
      platform:
        description: EAS Cloud build and internal store target
        required: true
        default: all
        type: choice
        options: [all, android, ios]

concurrency:
  group: mobile-internal
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_ENV: production
  MUXR_EAS_PROJECT_ID: 94c02367-50fe-44e0-a6d5-8461a0d06058
  MUXR_PUBLIC_BASE_URL: https://trymuxr.com
  MUXR_DISTRIBUTION: store
  EXPO_PUBLIC_MUXR_MODE: hosted
  EXPO_PUBLIC_MUXR_RELAY_URL: wss://trymuxr.com

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: stores
    env:
      PLATFORM: ${{ inputs.platform }}
      HAS_EXPO_AUTH: ${{ secrets.EXPO_TOKEN != '' || secrets.EXPO_STATE_JSON != '' }}
      HAS_PLAY_CREDENTIAL: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: yarn
      - name: Verify CI credentials
        run: |
          test "$HAS_EXPO_AUTH" = true
          if [ "$PLATFORM" != ios ]; then test "$HAS_PLAY_CREDENTIAL" = true; fi
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Mobile release gate
        run: |
          yarn build
          yarn workspace @muxr/wire build
          yarn workspace @muxr/mobile typecheck
          yarn workspace @muxr/mobile vitest run sources/auth/accountSession.integration.spec.ts sources/sync/sessionSync.integration.spec.ts
          node scripts/checkMobileCommerceBuilds.mjs
          node scripts/checkNoSecrets.mjs

  build-and-submit:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: stores
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_STATE_JSON: ${{ secrets.EXPO_STATE_JSON }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Restore Expo authentication
        if: env.EXPO_TOKEN == ''
        run: |
          mkdir -p ~/.expo
          printf '%s' "$EXPO_STATE_JSON" > ~/.expo/state.json
          chmod 600 ~/.expo/state.json
      - name: Materialize Play credential
        if: inputs.platform != 'ios'
        working-directory: apps/mobile
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json
          chmod 600 play-service-account.json
      - name: Build in EAS Cloud and submit internally
        working-directory: apps/mobile
        run: |
          mkdir -p "$RUNNER_TEMP/eas"
          npx eas-cli@22.0.0 build \
            --platform "$PLATFORM" \
            --profile production \
            --auto-submit-with-profile production \
            --wait \
            --non-interactive \
            --json \
            > "$RUNNER_TEMP/eas/result.json" \
            2> >(tee "$RUNNER_TEMP/eas/build.log" >&2)
          jq -e 'length > 0 and all(.[]; .status == "FINISHED" and (.submissions | length > 0) and all(.submissions[]; .status == "FINISHED"))' "$RUNNER_TEMP/eas/result.json"
      - name: Write release summary
        if: success()
        run: |
          {
            echo "## Mobile internal testing"
            echo
            echo "| Platform | Version | Store build | EAS build | EAS submission |"
            echo "| --- | --- | --- | --- | --- |"
            jq -r '.[] | "| \(.platform) | \(.appVersion) | \(.appBuildVersion) | `\(.id)` | `\(.submissions[0].id)` |"' "$RUNNER_TEMP/eas/result.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload EAS diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eas-cloud-result-${{ inputs.platform }}
          path: ${{ runner.temp }}/eas
          retention-days: 7
          if-no-files-found: warn
