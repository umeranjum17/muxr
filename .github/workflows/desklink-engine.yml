name: desklink engine

# Builds the prebuilt Linux x64 desktop engine from source in its pinned
# container, packs the two @desklink tarballs, and installs them into a clean
# project to prove the engine starts and answers its protocol. It is an
# independent rebuild to compare against the one being released: the digests are
# printed in the log.
#
# Manual dispatch only: nothing here runs on a pull request or a merge to main.
# It publishes nothing and uploads nothing; the packages are released by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive --ignore-scripts
      - run: npx tsc --build packages/desktop-host
      - run: packages/desktop-host/release/build-engine.sh
      - run: node packages/desktop-host/release/pack.mjs --engine dist-desklink/engine-linux-x64-gnu
      - run: packages/desktop-host/release/check-install.sh
