name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn build
      - name: Full suite (typecheck, crypto, pairing, e2e, package smoke, purity, secrets)
        run: node scripts/runSuite.mjs
      - name: Core purity guard
        run: node scripts/checkCorePurity.mjs
