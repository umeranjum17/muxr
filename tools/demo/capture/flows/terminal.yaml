appId: com.trymuxr.app
---
# Search rather than scroll: the herd reorders by activity, so a row's position
# is never the same twice, but its name is.
- tapOn: "Search"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "ui-polish"
- extendedWaitUntil:
    visible: "Open ui-polish"
    timeout: 20000
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 4000
- tapOn: "Open ui-polish"
- extendedWaitUntil:
    visible: "Type a prompt…"
    timeout: 25000
- waitForAnimationToEnd:
    timeout: 4000
# Hold on the terminal and read it, rather than arriving and cutting. The desk
# shot puts this pane beside its desktop window, so the pane has to be on screen
# for the whole shot, not the last second of it.
- swipe:
    start: "50%, 42%"
    end: "50%, 66%"
    duration: 1100
- waitForAnimationToEnd:
    timeout: 3000
- swipe:
    start: "50%, 62%"
    end: "50%, 40%"
    duration: 1100
- waitForAnimationToEnd:
    timeout: 4000
