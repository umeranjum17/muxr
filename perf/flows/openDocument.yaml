appId: com.trymuxr.app
tags:
  - perf
---
# Open the release gate's document fixture so the reading surface can be
# measured. Navigation only: the gate scripts the scroll and the swipes, and
# asserts the fixture text is really on screen before it resets a counter.
- tapOn:
    text: 'CANCEL|Not now|Deny|Later'
    optional: true
- tapOn:
    text: 'CANCEL|Not now|Deny|Later'
    optional: true
# `Back` is the label the shared HeaderBackButton exposes on every pushed page.
- runFlow:
    when:
      visible:
        text: 'Back'
    commands:
      - tapOn:
          text: 'Back'
- extendedWaitUntil:
    visible:
      text: 'connected'
    timeout: 40000
- extendedWaitUntil:
    visible:
      text: 'LIVE'
    timeout: 40000
# `Files` is a plugin navigation item, and those render on the herd screen
# (`DeclarativeNavigationItems` in herd/presentation/MainView.tsx) -- not
# inside a session. It exists only because the gate now starts the fake herd
# with the real `code` plugin.
- tapOn:
    text: 'Files'
- extendedWaitUntil:
    visible:
      text: 'perf-document.md|All Files|Changes'
    timeout: 20000
# A repo list comes first on a machine with more than one worktree; the file
# list is one tap in either way.
- tapOn:
    text: 'project|perf-document.md'
    optional: true
- extendedWaitUntil:
    visible:
      text: 'perf-document.md'
    timeout: 20000
- tapOn:
    text: 'perf-document.md'
# The fixture's own numbered lines: proof the reading surface mounted with the
# document on it, not that some file list is still open.
- extendedWaitUntil:
    visible:
      text: 'PERF_LINE_.*'
    timeout: 20000
