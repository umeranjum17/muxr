apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.sshtunnel'
version = '0.1.0'

android {
  namespace 'expo.modules.sshtunnel'
  compileSdk rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
  defaultConfig {
    minSdk rootProject.ext.has('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
    consumerProguardFiles 'proguard-rules.pro'
  }
  kotlinOptions { jvmTarget = '17' }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  packagingOptions {
    // sshj and Bouncy Castle each ship these; Android refuses duplicates.
    excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA']
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${kotlinVersion}"
  implementation('com.hierynomus:sshj:0.40.0') {
    // The app already uses the jdk15to18 family through tcp-socket. Keep
    // one Bouncy Castle family in the APK; the packages are compatible.
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    exclude group: 'org.bouncycastle', module: 'bcpkix-jdk18on'
    exclude group: 'org.bouncycastle', module: 'bcutil-jdk18on'
  }
  implementation 'org.bouncycastle:bcprov-jdk15to18:1.81'
  implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
  implementation 'org.bouncycastle:bcutil-jdk15to18:1.81'
  implementation 'org.slf4j:slf4j-api:2.0.16'
}
