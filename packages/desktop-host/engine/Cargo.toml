[package]
name = "desklink-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Per-user on-demand desktop capture, encode and input engine speaking a versioned local control protocol"
publish = false

[[bin]]
name = "desklink-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time", "signal"] }
futures-util = "0.3"
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
pipewire = { version = "0.10", features = ["v0_3_44"] }
libc = "0.2"
bytes = "1"
webrtc = { version = "0.21", default-features = false, features = ["crypto-ring"] }
rtc = { version = "0.21", default-features = false, features = ["crypto-ring"] }
xkbcommon = "0.8"
wl-clipboard-rs = "0.9"
log = "0.4"
async-trait = "0.1"
rand = "0.8"

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
opt-level = 2
