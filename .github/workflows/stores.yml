name: release stores

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and submit
        required: true
        type: string
      platform:
        description: Store target
        required: true
        default: all
        type: choice
        options: [all, android, ios]

concurrency:
  group: stores-${{ inputs.tag || github.ref_name }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_ENV: production
  MUXR_EAS_PROJECT_ID: 94c02367-50fe-44e0-a6d5-8461a0d06058
  MUXR_PUBLIC_BASE_URL: https://trymuxr.com
  MUXR_DISTRIBUTION: store
  EXPO_PUBLIC_MUXR_MODE: hosted
  EXPO_PUBLIC_MUXR_RELAY_URL: wss://trymuxr.com

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: stores
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: yarn
      - name: Verify immutable version and CI credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_STATE_JSON: ${{ secrets.EXPO_STATE_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
          test -n "$PLAY_SERVICE_ACCOUNT_JSON"
          test -n "$EXPO_TOKEN" || test -n "$EXPO_STATE_JSON"
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Release gate
        run: |
          yarn build
          yarn workspace @muxr/wire build
          yarn workspace @muxr/mobile typecheck
          yarn workspace @muxr/mobile vitest run sources/auth/accountSession.integration.spec.ts sources/sync/sessionSync.integration.spec.ts
          node scripts/checkMobileCommerceBuilds.mjs
          node scripts/checkNoSecrets.mjs

  android:
    if: inputs.platform != 'ios'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: stores
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_STATE_JSON: ${{ secrets.EXPO_STATE_JSON }}
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: yarn
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Restore Expo authentication
        if: env.EXPO_TOKEN == ''
        run: |
          mkdir -p ~/.expo
          printf '%s' "$EXPO_STATE_JSON" > ~/.expo/state.json
          chmod 600 ~/.expo/state.json
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Give Android lint enough JVM metaspace
        run: sed -i 's/MaxMetaspaceSize=512m/MaxMetaspaceSize=1536m/' apps/mobile/android/gradle.properties
      - name: Build Android locally with EAS
        working-directory: apps/mobile
        run: npx eas-cli@22.0.0 build --platform android --profile production --local --non-interactive --output "$RUNNER_TEMP/muxr.aab"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-store
          path: ${{ runner.temp }}/muxr.aab
          retention-days: 7
          if-no-files-found: error

  ios:
    if: inputs.platform != 'android'
    needs: verify
    runs-on: macos-15
    environment: stores
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_STATE_JSON: ${{ secrets.EXPO_STATE_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: yarn
      - name: Restore Expo authentication
        if: env.EXPO_TOKEN == ''
        run: |
          mkdir -p ~/.expo
          printf '%s' "$EXPO_STATE_JSON" > ~/.expo/state.json
          chmod 600 ~/.expo/state.json
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Select Xcode 26
        run: |
          xcode=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$xcode"
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Build iOS locally with EAS
        working-directory: apps/mobile
        run: npx eas-cli@22.0.0 build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/muxr.ipa"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-store
          path: ${{ runner.temp }}/muxr.ipa
          retention-days: 7
          if-no-files-found: error

  submit-android:
    if: inputs.platform != 'ios'
    needs: android
    runs-on: ubuntu-latest
    environment: stores
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_STATE_JSON: ${{ secrets.EXPO_STATE_JSON }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - run: yarn install --frozen-lockfile --non-interactive
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-store
          path: artifacts/android
      - name: Restore Expo authentication
        if: env.EXPO_TOKEN == ''
        run: |
          mkdir -p ~/.expo
          printf '%s' "$EXPO_STATE_JSON" > ~/.expo/state.json
          chmod 600 ~/.expo/state.json
      - name: Materialize Play credential
        working-directory: apps/mobile
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json
          chmod 600 play-service-account.json
      - name: Submit Android internal release
        working-directory: apps/mobile
        run: npx eas-cli@22.0.0 submit --platform android --profile production --path "$GITHUB_WORKSPACE/artifacts/android/muxr.aab" --non-interactive --wait

  submit-ios:
    if: inputs.platform != 'android'
    needs: ios
    runs-on: ubuntu-latest
    environment: stores
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_STATE_JSON: ${{ secrets.EXPO_STATE_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - run: yarn install --frozen-lockfile --non-interactive
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-store
          path: artifacts/ios
      - name: Restore Expo authentication
        if: env.EXPO_TOKEN == ''
        run: |
          mkdir -p ~/.expo
          printf '%s' "$EXPO_STATE_JSON" > ~/.expo/state.json
          chmod 600 ~/.expo/state.json
      - name: Submit iOS to App Store Connect
        working-directory: apps/mobile
        run: npx eas-cli@22.0.0 submit --platform ios --profile production --path "$GITHUB_WORKSPACE/artifacts/ios/muxr.ipa" --non-interactive --wait
