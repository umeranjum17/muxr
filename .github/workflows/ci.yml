name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn build
      - name: Full suite (typecheck, crypto, pairing, e2e, package smoke, purity, secrets, architecture)
        run: yarn run check
      - name: Core purity guard
        run: node scripts/diagnostics/application/checkCorePurity.mjs
