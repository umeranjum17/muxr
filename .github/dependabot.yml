version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      byokit:
        patterns:
          - '@byokit/*'
      desklink:
        patterns:
          - '@desklink/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
