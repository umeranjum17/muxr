appId: com.trymuxr.app
---
- tapOn: "Start or open realtime conversation"
# The overlay opens on "Connecting…" and settles to "Listening" once the
# provider stream is up.
- extendedWaitUntil:
    visible: "Listening"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 2000
# Hold. The visual reads live PCM every frame — it is the shot, and it needs
# seconds on camera, not a beat. Re-asserting is the wait; nothing is touched.
# Hold long enough for the session to carry a transcript. The bare orb leaves
# the bottom third of the frame flat, which is the weakest tile on the
# carousel; the transcript is what makes it read as a conversation.
- repeat:
    times: 16
    commands:
      - waitForAnimationToEnd:
          timeout: 800
