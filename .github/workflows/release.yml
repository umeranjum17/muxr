name: release

# A release is a merged version bump. PRs own the full suite; main only does
# release work the PR cannot. Manual releases retain their own suite check.
# When the root package.json version is not yet on npm, the build job packs
# @trymuxr/cli, checks the installed package and seals it. Only the publish job
# holds id-token: write, and it installs no project dependencies: it publishes
# the sealed tarball through npm trusted publishing (OIDC). No npm token exists
# anywhere. Trusted publishing cannot move a dist-tag, so a stable version is
# published straight under `latest`, and only once its release journey passed
# on the exact sealed APK and tarball and a manual run carries exactly one
# attestation: captain_tested after his own phone test, or owner_authorized
# with a committed owner authorization before he can test it (published
# labelled owner-authorized and NOT owner-tested, never recorded as his test).
# An already-sealed stable dispatched from main is forwarded to its release
# tag without rebuilding: npm provenance uses the run's source SHA, not checkout's.
# Future release tags must carry this workflow. A push never publishes a stable
# version; it builds, seals and reports the gate.
# When the version is already on npm, the build job only confirms it.
#
# Gaps, not published by this workflow:
# - @desklink/host and its platform packages: published from the desklink repository.
# - @trymuxr/contract and @trymuxr/crypto: workspace libraries, not published; publish or mark private is a maintainer decision.
on:
  push:
    branches: [main]
    # Match the PR scope's docs/evidence exclusions. Keep product-read README
    # and SKILL files included, even inside an otherwise excluded directory.
    # This workflow is not a required PR check, so it can be filtered outright.
    paths:
      - '**'
      - '!**/*.md'
      - '!**/*.mdx'
      - '!docs/**'
      - '!data/**'
      - '!screenshots/**'
      - '!LICENSE'
      - '!NOTICE'
      - '!TRADEMARK'
      - '**/README.md'
      - '**/SKILL.md'
  workflow_dispatch:
    inputs:
      captain_tested:
        description: The captain's own phone test passed on this stable build; publish it as npm latest
        type: boolean
        default: false
      owner_authorized:
        description: The captain authorized this stable build before testing it (a committed owner authorization for the version); publish it as npm latest, labelled owner-authorized and NOT owner-tested. Leave captain_tested unchecked
        type: boolean
        default: false
      version:
        description: The stable version tested or owner-authorized, or optional exact version matching nightly_tag
        type: string
        default: ''
      sealed_release:
        description: Existing sealed stable version to publish unchanged as npm latest (run from main; set version and exactly one attestation)
        type: string
        default: ''
      nightly_tag:
        description: Already-sealed nightly tag to publish unchanged to npm nightly (run from main)
        type: string
        default: ''

concurrency:
  # Two publications never race for one version.
  group: npm-publication
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'umeranjum17/muxr'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.release.outputs.needed }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      commit: ${{ steps.release.outputs.commit }}
      run_id: ${{ steps.release.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
      - run: npm install --global npm@11.6.2
      - if: inputs.nightly_tag == '' && inputs.sealed_release == ''
        run: yarn install --frozen-lockfile --non-interactive
      - if: inputs.nightly_tag == '' && inputs.sealed_release == ''
        run: yarn build
      - name: Full suite for a manual release (PRs already checked a main push)
        if: github.event_name == 'workflow_dispatch' && inputs.nightly_tag == '' && inputs.sealed_release == ''
        run: yarn run check
      - id: release
        name: Resolve a sealed release, or decide whether the checkout version is unpublished
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ inputs.nightly_tag }}
          REQUESTED_VERSION: ${{ inputs.version }}
          SEALED_RELEASE: ${{ inputs.sealed_release }}
          OWNER_AUTHORIZED: ${{ inputs.owner_authorized }}
          CAPTAIN_TESTED: ${{ inputs.captain_tested }}
        run: |
          set -euo pipefail
          if [ -n "$SEALED_RELEASE" ]; then
            flags=()
            if [ "$OWNER_AUTHORIZED" = true ]; then flags+=(--owner-authorized); fi
            if [ "$CAPTAIN_TESTED" = true ]; then flags+=(--captain-tested); fi
            node scripts/release/presentation/stableDecision.mjs --version "$SEALED_RELEASE" --requested-version "$REQUESTED_VERSION" --nightly-tag "$NIGHTLY_TAG" "${flags[@]}" --directory "$RUNNER_TEMP/package" --download
          elif [ -n "$NIGHTLY_TAG" ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo 'Dispatch nightly_tag from main, not from the old tag tree' >&2; exit 1; }
            node scripts/release/presentation/nightlyDecision.mjs --tag "$NIGHTLY_TAG" --version "$REQUESTED_VERSION" --directory "$RUNNER_TEMP/package" --download
          else
            node scripts/release/presentation/releaseDecision.mjs
          fi
      - name: Pack and check the installed package
        if: steps.release.outputs.needed == 'true' && inputs.nightly_tag == '' && inputs.sealed_release == ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          yarn run pack
          mkdir -p "$RUNNER_TEMP/package"
          npm pack ./dist-npm --pack-destination "$RUNNER_TEMP/package"
          install_root="$RUNNER_TEMP/release-install"
          npm install --prefix "$install_root" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/package/*.tgz
          mkdir -p "$RUNNER_TEMP/release-home"
          cli="$install_root/node_modules/@trymuxr/cli/cli.mjs"
          # The installed CLI reports the version about to be published.
          test "$(HOME="$RUNNER_TEMP/release-home" node "$cli" version)" = "$VERSION"
      - name: Seal the packed tarball as the release candidate
        if: steps.release.outputs.needed == 'true' && inputs.nightly_tag == '' && inputs.sealed_release == ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          node --input-type=module <<'JS'
          import { readdirSync } from 'node:fs';
          import { sealRelease } from './scripts/release/application/sealRelease.mjs';
          const directory = `${process.env.RUNNER_TEMP}/package`;
          await sealRelease({ directory, version: process.env.VERSION, channel: process.env.CHANNEL, files: readdirSync(directory), runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT });
          JS
      - name: Keep the sealed release for the publish job
        if: steps.release.outputs.needed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release
          path: ${{ runner.temp }}/package
          retention-days: 90
          if-no-files-found: error

  dispatch-sealed:
    needs: build
    if: inputs.sealed_release != '' && github.ref == 'refs/heads/main' && needs.build.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v${{ needs.build.outputs.version }}
      SEALED_RELEASE: ${{ inputs.sealed_release }}
      REQUESTED_VERSION: ${{ inputs.version }}
      OWNER_AUTHORIZED: ${{ inputs.owner_authorized }}
      CAPTAIN_TESTED: ${{ inputs.captain_tested }}
      NIGHTLY_TAG: ${{ inputs.nightly_tag }}
    steps:
      # Dispatch returns immediately; the tag run waits for this run's shared
      # publication lock. No OIDC token or publication happens on main.
      - name: Run sealed publication at the tag commit, not the dispatcher commit
        run: |
          gh workflow run release.yml --ref "$RELEASE_TAG" \
            -f sealed_release="$SEALED_RELEASE" -f version="$REQUESTED_VERSION" \
            -f owner_authorized="$OWNER_AUTHORIZED" -f captain_tested="$CAPTAIN_TESTED" \
            -f nightly_tag="$NIGHTLY_TAG"
          echo "Sealed publication dispatched at $RELEASE_TAG; follow its release run for the result." >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    # Unpublished sealed stables can publish only in the tag run. Already-live
    # versions retain main's idempotent public-surface checks; nightly is unchanged.
    if: (github.ref == 'refs/heads/main' && (inputs.sealed_release == '' || needs.build.outputs.needed != 'true')) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      # Repository-wide write, used for the public channel catalog and for
      # GitHub's Latest flag, and only when the candidate's release exists.
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_RELEASE_TAG: v${{ needs.build.outputs.version }}
      RELEASE_COMMIT: ${{ needs.build.outputs.commit || github.sha }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.build.outputs.channel }}
      BUILD_RUN_ID: ${{ needs.build.outputs.run_id || github.run_id }}
      NIGHTLY_TAG: ${{ inputs.nightly_tag }}
      SEALED_RELEASE: ${{ inputs.sealed_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The receipt gate walks history from the proved commit to this one.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11.6.2
      - if: needs.build.outputs.needed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release
          path: ${{ runner.temp }}/package
      - id: github-release
        name: Check for the candidate's GitHub release
        run: |
          if gh release view "$GITHUB_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No $GITHUB_RELEASE_TAG GitHub release exists, and only the candidate flow creates one: a stable version is not published without it, and the public channel catalog and GitHub release were not updated." >> "$GITHUB_STEP_SUMMARY"
          fi
      # No model and no key: git objects, the release manifest and the sealed
      # tarball. It never publishes, so it also answers a dry run.
      - id: accepted
        name: Require the release journey on this exact build before npm latest
        if: needs.build.outputs.needed == 'true' && needs.build.outputs.channel == 'stable' && steps.github-release.outputs.exists == 'true'
        env:
          CAPTAIN_TESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.captain_tested && inputs.version || '' }}
          OWNER_AUTHORIZATION_NOTICE_FILE: ${{ runner.temp }}/owner-authorization.txt
          OWNER_AUTHORIZED: ${{ github.event_name == 'workflow_dispatch' && inputs.owner_authorized && !inputs.captain_tested && inputs.version || '' }}
        run: node scripts/release/presentation/acceptStable.mjs --version "$RELEASE_VERSION" --package "$RUNNER_TEMP"/package/*.tgz --captain-tested "$CAPTAIN_TESTED" --owner-authorized "$OWNER_AUTHORIZED"
      - name: Bind sealed stable provenance to the resolved tag commit
        if: needs.build.outputs.needed == 'true' && inputs.sealed_release != ''
        run: |
          test "$GITHUB_REF" = "refs/tags/v$SEALED_RELEASE"
          test "$GITHUB_SHA" = "$RELEASE_COMMIT"
      - name: Publish with provenance
        if: needs.build.outputs.needed == 'true' && (needs.build.outputs.channel != 'stable' || steps.accepted.outputs.accepted == 'true')
        env:
          OWNER_AUTHORIZATION_NOTICE_FILE: ${{ runner.temp }}/owner-authorization.txt
        run: node scripts/release/presentation/publishNpm.mjs
      - id: live
        name: Check whether npm latest serves this version
        env:
          NEEDED: ${{ needs.build.outputs.needed }}
        run: |
          if [ -n "$NIGHTLY_TAG" ] && [ "$NEEDED" != true ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_VERSION already published with identical bytes; no publication or tag movement." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RELEASE_CHANNEL" != stable ] || [ "$(npm view @trymuxr/cli dist-tags.latest)" = "$RELEASE_VERSION" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [ "$NEEDED" != true ]; then
              echo "$RELEASE_VERSION was published under next before stable went straight to latest, and trusted publishing cannot move a tag: the next stable version becomes latest once its release journey passes." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      # No model and no key: git objects and the release manifest only. A
      # stable release reaches GitHub Latest and the public channel only when a
      # committed receipt proves the phone-attach journey on the code it ships
      # and on the exact APK and npm tarball its release sealed.
      - name: Require the phone-attach receipt for this stable commit and build
        if: steps.live.outputs.ready == 'true' && steps.github-release.outputs.exists == 'true' && needs.build.outputs.channel == 'stable'
        run: node scripts/release/presentation/checkJourneyReceipt.mjs --tag "$GITHUB_RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - name: Say in the release notes that the build is owner-authorized and not owner-tested
        if: steps.live.outputs.ready == 'true' && steps.github-release.outputs.exists == 'true' && steps.accepted.outputs.owner_authorized == 'true'
        env:
          OWNER_AUTHORIZATION_NOTICE_FILE: ${{ runner.temp }}/owner-authorization.txt
        run: node scripts/release/presentation/noteOwnerAuthorization.mjs --tag "$GITHUB_RELEASE_TAG"
      - name: Promote the accepted stable release to GitHub Latest
        if: steps.live.outputs.ready == 'true' && steps.github-release.outputs.exists == 'true' && needs.build.outputs.channel == 'stable'
        run: node scripts/release/presentation/promoteReleaseVisibility.mjs --tag "$GITHUB_RELEASE_TAG"
      - name: Point the public channel at this release
        if: steps.live.outputs.ready == 'true' && steps.github-release.outputs.exists == 'true'
        run: node scripts/release/presentation/updateChannelCatalog.mjs --tag "$GITHUB_RELEASE_TAG"
      - name: Verify every public surface serves this release
        if: steps.live.outputs.ready == 'true' && steps.github-release.outputs.exists == 'true'
        run: node scripts/release/presentation/verifyPublicRelease.mjs --tag "$GITHUB_RELEASE_TAG" --channel "$RELEASE_CHANNEL"
      - name: Summarize the completed release
        if: steps.live.outputs.ready == 'true' && steps.github-release.outputs.exists == 'true'
        run: |
          set -euo pipefail
          # The npm tag is the domain's, not the channel name: stable is latest.
          tag=$(node -e "import('./scripts/release/domain/channel.mjs').then((m) => process.stdout.write(m.channelTags[process.env.RELEASE_CHANNEL] ?? ''))")
          [ -n "$tag" ] || { echo "no npm dist-tag for channel $RELEASE_CHANNEL" >&2; exit 1; }
          {
            echo "## muxr $RELEASE_VERSION published on $RELEASE_CHANNEL"
            echo
            echo "- Download: https://trymuxr.com/downloads/$RELEASE_CHANNEL/android"
            echo "- Channel page: https://trymuxr.com/downloads/$RELEASE_CHANNEL"
            echo "- Release notes: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$GITHUB_RELEASE_TAG"
            echo "- Install: \`npm install -g --ignore-scripts @trymuxr/cli@$tag\`"
          } >> "$GITHUB_STEP_SUMMARY"
