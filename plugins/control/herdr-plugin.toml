id = "muxr.control"
name = "muxr — Start here"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Start here: installs the muxr CLI from npm as your user (exact version, verified, no sudo) and opens Setup, Pair, Devices, Doctor, Service, shared relay and host voice as Herdr panes"
platforms = ["linux", "macos"]

# Thin bootstrap: install the pinned CLI payload on plugin install. The real
# payload stays npm @trymuxr/cli (trusted publishing + provenance); the
# plugin never vendors the runtime and never owns updates.
[[build]]
command = ["node", "./build.mjs"]

# Control-plane only: kick the already-configured systemd/launchd service.
# Daemon lifecycle stays with the OS service muxr writes; Herdr has no
# supervised-service primitive, so this hook never configures or restarts.
[[startup]]
command = ["node", "./run.mjs", "start-if-configured"]

# Herdr already owns pane layout, so these need no backend script of their own:
# an action process inherits HERDR_PANE_ID from the invocation context, which is
# the session the phone is looking at, and `--current` reads it.
[[actions]]
id = "split-right"
title = "Split right"
description = "Open a new pane beside this one"
contexts = ["pane"]
command = ["herdr", "pane", "split", "--current", "--direction", "right"]

[[actions]]
id = "split-down"
title = "Split down"
description = "Open a new pane below this one"
contexts = ["pane"]
command = ["herdr", "pane", "split", "--current", "--direction", "down"]

# Every pane runs one declared muxr operation through run.mjs, which
# executes the recorded runtime (~/.muxr/herdr-plugin.runtime) and carries
# the invoking Herdr instance. Pairing defaults to browser Control; the
# other grants and native pairing stay explicit alternatives.
[[panes]]
id = "setup"
title = "muxr setup"
placement = "overlay"
command = ["node", "./run.mjs", "setup"]

[[panes]]
id = "pair"
title = "Pair this browser (Control, 8 hours)"
placement = "overlay"
command = ["node", "./run.mjs", "pair"]

[[panes]]
id = "pair-view"
title = "Pair a View-only browser (8 hours)"
placement = "overlay"
command = ["node", "./run.mjs", "pair-view"]

[[panes]]
id = "pair-personal"
title = "Pair a personal browser (Control, 30 days)"
placement = "overlay"
command = ["node", "./run.mjs", "pair-personal"]

[[panes]]
id = "pair-native"
title = "Pair the native app (QR)"
placement = "overlay"
command = ["node", "./run.mjs", "pair-native"]

[[panes]]
id = "devices"
title = "muxr devices"
placement = "overlay"
command = ["node", "./run.mjs", "devices"]

[[panes]]
id = "doctor"
title = "muxr doctor"
placement = "overlay"
command = ["node", "./run.mjs", "doctor"]

[[panes]]
id = "service"
title = "muxr service"
placement = "overlay"
command = ["node", "./run.mjs", "service"]

[[panes]]
id = "shared-relay"
title = "muxr shared relay"
placement = "overlay"
command = ["node", "./run.mjs", "shared-relay"]

[[panes]]
id = "voice"
title = "muxr host voice"
placement = "overlay"
command = ["node", "./run.mjs", "voice"]
