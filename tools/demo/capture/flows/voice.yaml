appId: com.trymuxr.app
---
- tapOn: "Start or open realtime conversation"
# The overlay opens on "Connecting…" and settles to "Listening" once the
# provider stream is up.
- extendedWaitUntil:
    visible: "Listening"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 2000
# Hold. The visual reads live PCM every frame — it is the shot, and it needs
# seconds on camera, not a beat. Re-asserting is the wait; nothing is touched.
- repeat:
    times: 9
    commands:
      - assertVisible: "Listening"
      - waitForAnimationToEnd:
          timeout: 800
