appId: com.trymuxr.app
tags:
  - perf
---
# Pair the app with the throwaway host the gate spawned. The code rotates every
# two minutes, so the runner passes the live one in and this flow must not wait
# on anything slow before submitting it.
- launchApp:
    appId: com.trymuxr.app
    clearState: false
# A cold launch settles on one of three screens: the first-install welcome, which
# has no local account yet, the pairing entry of a run that already made one, or
# -- on a retry -- the herd screen of a connection that dropped.
- extendedWaitUntil:
    visible:
      text: 'Create account|Enter pairing string|Pairing string|Enter another code|LIVE|disconnected'
    timeout: 40000
# The account is device-local, so creating it is the one tap a fresh install owes
# before pairing. A rerun that already has one never sees this and never resets.
- runFlow:
    when:
      visible:
        text: 'Create account'
    commands:
      - tapOn:
          text: 'Create account'
      # Account creation navigates on its own; typing before it settles types
      # into whatever screen the transition left under the cursor.
      - extendedWaitUntil:
          visible:
            text: 'Enter pairing string|Pairing string|Enter another code|LIVE|disconnected'
          timeout: 60000
# A failed attempt leaves the error state, which shows no input at all.
- tapOn:
    text: 'Enter another code'
    optional: true
# Neither the welcome screen nor a disconnected herd shows the form, and both a
# fresh account and a retry land on the same "Set up connection" button. Tap it
# and require the manual-entry affordance before anything is typed.
- runFlow:
    when:
      notVisible:
        text: 'Pairing string'
    commands:
      - assertVisible: 'Set up connection'
      - tapOn:
          text: 'Set up connection'
      - extendedWaitUntil:
          visible:
            text: 'Enter pairing string manually|Enter another code'
          timeout: 40000
      - tapOn:
          text: 'Enter pairing string manually|Enter another code'
- extendedWaitUntil:
    visible:
      text: 'Pairing string'
    timeout: 40000
# The code goes into the input itself, never a label that happens to match.
- assertVisible: 'Pairing string'
- tapOn: 'Pairing string'
- eraseText: 120
- inputText: '${PAIR_CODE}'
- tapOn: 'Connect'
- extendedWaitUntil:
    visible:
      text: 'THIS PHONE WILL BE ABLE TO'
    timeout: 20000
- scrollUntilVisible:
    element:
      text: '^(Pair|Continue|Allow|Approve|Trust).*'
    direction: DOWN
- tapOn:
    text: '^(Pair|Continue|Allow|Approve|Trust).*'
# Android's background-activity prompt can land on top of the herd, and more
# than one prompt can queue behind it.
- tapOn:
    text: 'CANCEL|Not now|Deny|Later'
    optional: true
- tapOn:
    text: 'CANCEL|Not now|Deny|Later'
    optional: true
# The first connect fetches the whole herd before anything is on screen.
- extendedWaitUntil:
    visible:
      text: 'LIVE|SPACES|Machine'
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: 'connected'
    timeout: 40000
