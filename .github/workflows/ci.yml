name: ci

# Both jobs run only when dispatched by hand. Pull requests get no automatic
# checks by design, and nothing runs on pushes to main; validation happens
# locally (`yarn run check:fast` while iterating, `yarn run check` before opening
# a PR). Deliberately no push trigger either: merging to main must never invoke
# automated pipelines, and releases stay manual-dispatch only.
#
# `fast` runs beside `suite`, not before it: a type error or a broken flow test should
# be visible in about two minutes rather than behind a full build, a web export
# and an install smoke. Neither job publishes, deploys, packs, or tags anything.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck, the compiled self-checks, every vitest flow, and the architecture
  # policies -- the exact list `yarn check:fast` runs, so a red mark here is
  # reproducible in one local command. It deliberately does NOT build a package,
  # export the web app, drive an install, or touch a release artifact: it is
  # early feedback when dispatched by hand, never a release trigger.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Fast lane (typecheck, self-checks, vitest flows, architecture)
        run: yarn run check:fast

  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn build
      - name: Production web export (self-host, origin-clean)
        run: yarn web:export:selfhost
      - name: Web export checks against dist (manifest, budget, no marketing origin)
        run: node scripts/diagnostics/application/checkWebExport.mjs
      - name: Live web serving delivery (relay + static server over HTTP)
        run: node scripts/diagnostics/application/checkWebServing.mjs
      - name: Export chain isolation (canary export + full-dist secret scan)
        run: node scripts/diagnostics/application/checkExportIsolation.mjs
      - name: Full suite (typecheck, crypto, pairing, e2e, package smoke, purity, secrets, architecture)
        run: yarn run check
      - name: Core purity guard
        run: node scripts/diagnostics/application/checkCorePurity.mjs
