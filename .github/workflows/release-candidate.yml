name: release candidate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character main commit tested by the captain
        required: true
        type: string
      channel:
        description: Nightly from tested main, or an unpublished final-version stable candidate
        type: choice
        options: [nightly, stable]
        default: nightly
      version:
        description: Exact npm version (empty generates the next patch nightly version)
        type: string
        default: ''

concurrency:
  group: release-candidate
  cancel-in-progress: false
permissions:
  contents: read
  actions: read

jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.select.outputs.version }}
      app_version: ${{ steps.select.outputs.app_version }}
      channel: ${{ steps.select.outputs.channel }}
      version_code: ${{ steps.number.outputs.version_code }}
      build: ${{ steps.select.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: select
        name: Select the captain-tested main commit and channel
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_CHANNEL: ${{ inputs.channel || 'nightly' }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$REQUESTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_SOURCE_COMMIT" = "$GITHUB_SHA"
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { compareVersions, distribution } from './scripts/release/domain/channel.mjs';
          import { CATALOG_BRANCH, parseCatalog } from './scripts/release/domain/channelCatalog.mjs';
          import { readCatalogBranch } from './scripts/release/infrastructure/catalogBranch.mjs';
          const channel = process.env.REQUESTED_CHANNEL;
          const requested = process.env.REQUESTED_VERSION;
          if (!requested && channel === 'stable') throw new Error('A final stable candidate needs an explicit version');
          const nextPatch = (value) => {
            const parts = value.split('-')[0].split('.').map(Number);
            parts[2] += 1;
            return parts.join('.');
          };
          let version = requested;
          // Stable is chosen from its explicit input alone. Only a nightly has
          // to know what stable currently is, so only a nightly reads the
          // published channels, once.
          if (channel === 'nightly') {
            const repository = process.env.GITHUB_REPOSITORY;
            let published;
            try {
              published = parseCatalog(readCatalogBranch({ repository, branch: CATALOG_BRANCH }).text).channels;
            } catch (cause) {
              throw new Error(`cannot read the published channels (${cause.message}); refusing to choose a release version blindly`);
            }
            const stable = published.stable?.version;
            // A version picked without knowing stable can sort under it, and an
            // empty or missing catalog is exactly that unknown state.
            if (stable === undefined) throw new Error('the published channels carry no stable release to sort a nightly above');
            // The automatic base is the later of this checkout's next patch and
            // the published stable's next patch, so a nightly never sorts under
            // a stable promoted while the root manifest stayed behind.
            const rootBase = nextPatch(JSON.parse(readFileSync('package.json')).version);
            const floor = nextPatch(stable);
            const base = compareVersions(rootBase, floor) >= 0 ? rootBase : floor;
            version = requested || `${base}-${channel}.${process.env.GITHUB_RUN_NUMBER}.${process.env.GITHUB_RUN_ATTEMPT}`;
            if (compareVersions(version, stable) <= 0) throw new Error(`${version} does not sort above the published stable ${stable}`);
          }
          const selected = distribution(version, channel);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\napp_version=${selected.appVersion}\nchannel=${channel}\nbuild=true\n`);
          JS
      - name: Require an authored changelog entry for the selected version
        if: steps.select.outputs.build == 'true'
        run: node scripts/release/presentation/changelog.mjs validate --version "${{ steps.select.outputs.version }}" --channel "${{ steps.select.outputs.channel }}" --commit "$GITHUB_SHA"
      - name: Require the desktop engine packages on npm
        # The CLI installs @desklink/host, released from the desklink repository. Refuse
        # before a build number is spent rather than at the candidate's install.
        if: steps.select.outputs.build == 'true'
        run: node scripts/release/presentation/requireDesktopEngine.mjs
      - id: number
        if: steps.select.outputs.build == 'true'
        name: Reserve a never-reused Android build number
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/presentation/reserveAndroidBuild.mjs

  npm:
    needs: select
    if: needs.select.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MUXR_RELEASE_VERSION: ${{ needs.select.outputs.version }}
      MUXR_RELEASE_CHANNEL: ${{ needs.select.outputs.channel }}
      MUXR_PACKAGE_CONTROL_URL: https://trymuxr.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn build
      - name: Installed package flow
        # Smoke builds its own stable fixture. Final packaging below uses the selected version.
        run: env -u MUXR_RELEASE_VERSION -u MUXR_RELEASE_CHANNEL node scripts/diagnostics/application/checkPackageSmoke.mjs
      - name: Pack candidate once
        # The Expo config rejects a release identity whose base version differs
        # from the native app version, so pass the selected one to this step
        # only; the smoke above deliberately keeps the repository fixture.
        env:
          APP_VERSION: ${{ needs.select.outputs.app_version }}
        run: |
          yarn run pack
          mkdir -p "$RUNNER_TEMP/npm-candidate"
          npm pack ./dist-npm --pack-destination "$RUNNER_TEMP/npm-candidate"
          install_root="$RUNNER_TEMP/candidate-install"
          npm install --prefix "$install_root" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/npm-candidate/*.tgz
          mkdir -p "$RUNNER_TEMP/candidate-home"
          cli="$install_root/node_modules/@trymuxr/cli/cli.mjs"
          test "$(HOME="$RUNNER_TEMP/candidate-home" node "$cli" version)" = "$MUXR_RELEASE_VERSION"
          # No plugin ships bundled any more, so the candidate checks one it scaffolds itself.
          HOME="$RUNNER_TEMP/candidate-home" node "$cli" plugin create "$RUNNER_TEMP/candidate-plugin"
          HOME="$RUNNER_TEMP/candidate-home" node "$cli" plugin check "$RUNNER_TEMP/candidate-plugin"
          node --input-type=module <<'JS'
          import { readdirSync } from 'node:fs';
          import { prepareChangelog } from './scripts/release/application/prepareChangelog.mjs';
          import { sealRelease } from './scripts/release/application/sealRelease.mjs';
          const directory = `${process.env.RUNNER_TEMP}/npm-candidate`;
          const report = { version: process.env.MUXR_RELEASE_VERSION, channel: process.env.MUXR_RELEASE_CHANNEL,
            commit: process.env.GITHUB_SHA, directory };
          prepareChangelog({ mode: 'generate', ...report });
          prepareChangelog({ mode: 'check', ...report });
          await sealRelease({ directory, version: process.env.MUXR_RELEASE_VERSION, channel: process.env.MUXR_RELEASE_CHANNEL,
            files: readdirSync(directory), runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT });
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-candidate
          path: ${{ runner.temp }}/npm-candidate
          retention-days: 90
          if-no-files-found: error

  android:
    needs: select
    if: needs.select.outputs.build == 'true'
    uses: ./.github/workflows/mobile-android-internal.yml
    with:
      version: ${{ needs.select.outputs.app_version }}
      release_version: ${{ needs.select.outputs.version }}
      version_code: ${{ needs.select.outputs.version_code }}
      development: ${{ needs.select.outputs.channel == 'nightly' }}
    secrets: inherit

  release:
    needs: [select, npm, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.select.outputs.version }}
      CHANNEL: ${{ needs.select.outputs.channel }}
      BUILD_CODE: ${{ needs.select.outputs.version_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-internal
          path: ${{ runner.temp }}/android
      - name: Verify and attach immutable candidate
        run: node scripts/release/presentation/publishCandidate.mjs
