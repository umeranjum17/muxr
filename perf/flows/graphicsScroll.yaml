appId: com.trymuxr.app
tags:
  - perf
---
# Opens a session by tapping the first live card, the way herdNavigate.yaml
# proves works, because a `shell:` deep link does not mount this screen. The
# card under a fixed coordinate changes as the herd churns, so this flow only
# proves that tap navigation opens some session: the graphics gate pins its
# own proof pane by session route instead, because the fake herd paints the
# checkerboard into the first pane and no other.
#
# Short drags and flings mix the way a thumb does. The flow asserts no pixels:
# the gate reads the host's own account of the pipeline.
- tapOn:
    text: 'CANCEL|Not now|Deny|Later'
    optional: true
- tapOn:
    text: 'CANCEL|Not now|Deny|Later'
    optional: true
- runFlow:
    when:
      visible:
        text: 'Type a prompt.*'
    commands:
      - back
- runFlow:
    when:
      visible:
        text: 'Go back'
    commands:
      - back
- extendedWaitUntil:
    visible:
      text: 'connected'
    timeout: 40000
- extendedWaitUntil:
    visible:
      text: 'LIVE'
    timeout: 40000
- tapOn:
    point: 30%, 33%
- tapOn:
    text: 'CANCEL|Not now|Deny|Later'
    optional: true
# The terminal screen's own furniture; the surface itself has no label.
# Measured swipes live in the gate now (`scrollBout`); this flow only opens.
- extendedWaitUntil:
    visible:
      text: 'Terminal|Type a prompt.*'
    timeout: 20000
