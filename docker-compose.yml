# One-command self-host relay. Pair with `muxr self-host` on the same machine,
# or run standalone and mint tickets via the mint secret in the data volume.
services:
  relay:
    build: .
    ports:
      - "8792:8792"
    volumes:
      - relay-data:/data
    # Set MUXR_TRUST_PROXY=1 when a trusted reverse proxy sits in front.
    restart: unless-stopped

volumes:
  relay-data:
