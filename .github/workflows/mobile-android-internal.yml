name: mobile Android internal

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version, for example 0.1.13
        required: true
        type: string
      version_code:
        description: Positive Android versionCode
        required: true
        type: string
      submit_to_play:
        description: Upload the AAB to Play Internal
        required: true
        default: false
        type: boolean
      publish_github_release:
        description: Publish the APK to the matching GitHub Release
        required: true
        default: true
        type: boolean
      confirmation:
        description: Type release-VERSION-VERSION_CODE
        required: true
        type: string

concurrency:
  group: mobile-android-internal-${{ inputs.version }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ENV: production
  MUXR_PUBLIC_BASE_URL: https://trymuxr.com
  MUXR_DISTRIBUTION: store

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ inputs.version }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate release request
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ANDROID_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          test "$CONFIRMATION" = "release-$APP_VERSION-$ANDROID_VERSION_CODE"

  build:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: stores
    env:
      APP_VERSION: ${{ inputs.version }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      SUBMIT_TO_PLAY: ${{ inputs.submit_to_play }}
      ORG_GRADLE_PROJECT_appVersion: ${{ inputs.version }}
      ORG_GRADLE_PROJECT_androidVersionCode: ${{ inputs.version_code }}
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
    steps:
      - name: Validate credentials
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD != '' }}
          HAS_PLAY_CREDENTIAL: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          test "$HAS_KEYSTORE" = true
          test "$HAS_STORE_PASSWORD" = true
          test "$HAS_KEY_ALIAS" = true
          test "$HAS_KEY_PASSWORD" = true
          if [ "$SUBMIT_TO_PLAY" = true ]; then test "$HAS_PLAY_CREDENTIAL" = true; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: yarn
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Materialize signing store
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          keystore="$RUNNER_TEMP/android-upload.keystore"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ORG_GRADLE_PROJECT_releaseStoreFile=$keystore" >> "$GITHUB_ENV"
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Mobile release gate
        run: |
          yarn build
          yarn workspace @muxr/mobile typecheck
          yarn workspace @muxr/mobile vitest run sources/account/application/accountSession.integration.spec.ts sources/catalog/application/sessionSync.integration.spec.ts
          node scripts/diagnostics/application/checkMobileCommerceBuilds.mjs
          node scripts/diagnostics/application/checkNoSecrets.mjs
          node scripts/diagnostics/application/verifyNativePatches.mjs
      - name: Build signed APK and AAB
        working-directory: apps/mobile/android
        env:
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --max-workers=2
      - name: Verify signed artifacts and versions
        run: |
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          aab="apps/mobile/android/app/build/outputs/bundle/release/app-release.aab"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$apksigner"
          test -x "$apkanalyzer"
          "$apksigner" verify --verbose --print-certs "$apk"
          if aab_verify_output="$(jarsigner -verify -strict "$aab" 2>&1)"; then
            aab_verify_status=0
          else
            aab_verify_status=$?
          fi
          printf '%s\n' "$aab_verify_output"
          grep -q 'jar verified' <<<"$aab_verify_output"
          # A self-signed upload certificate is expected; jarsigner reports it as bit 4.
          if [ "$aab_verify_status" -ne 0 ]; then
            test "$aab_verify_status" -eq 4
            grep -qi 'self-signed' <<<"$aab_verify_output"
            ! grep -Eqi 'expired|not yet valid|algorithm.*disabled' <<<"$aab_verify_output"
          fi
          test "$("$apkanalyzer" manifest version-name "$apk")" = "$APP_VERSION"
          test "$("$apkanalyzer" manifest version-code "$apk")" = "$ANDROID_VERSION_CODE"
          curl -fsSL https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$RUNNER_TEMP/bundletool.jar" | sha256sum --check
          test "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle "$aab" --xpath '/manifest/@android:versionName')" = "$APP_VERSION"
          test "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle "$aab" --xpath '/manifest/@android:versionCode')" = "$ANDROID_VERSION_CODE"
      - name: Upload AAB to Play Internal
        if: inputs.submit_to_play
        env:
          AAB_PATH: ${{ github.workspace }}/apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          bundle exec fastlane android upload_internal
          bundle exec fastlane android verify_internal
      - name: Package provenance
        run: |
          output="$RUNNER_TEMP/android-internal"
          mkdir -p "$output"
          install -m 600 apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$output/muxr-$APP_VERSION-$ANDROID_VERSION_CODE.apk"
          install -m 600 apps/mobile/android/app/build/outputs/bundle/release/app-release.aab "$output/muxr-$APP_VERSION-$ANDROID_VERSION_CODE.aab"
          apk_sha="$(sha256sum "$output/muxr-$APP_VERSION-$ANDROID_VERSION_CODE.apk" | cut -d ' ' -f 1)"
          aab_sha="$(sha256sum "$output/muxr-$APP_VERSION-$ANDROID_VERSION_CODE.aab" | cut -d ' ' -f 1)"
          jq -n \
            --arg gitCommitHash "$GITHUB_SHA" \
            --arg appVersion "$APP_VERSION" \
            --arg appBuildVersion "$ANDROID_VERSION_CODE" \
            --argjson submittedToInternal "$SUBMIT_TO_PLAY" \
            --arg apkArtifactSha256 "$apk_sha" \
            --arg artifactSha256 "$aab_sha" \
            '{platform:"ANDROID", $gitCommitHash, $appVersion, $appBuildVersion, bundleIdentifier:"com.trymuxr.app", $submittedToInternal, $apkArtifactSha256, $artifactSha256}' \
            > "$output/result.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-internal
          path: ${{ runner.temp }}/android-internal
          retention-days: 7
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && inputs.publish_github_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      APP_VERSION: ${{ inputs.version }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: android-internal
          path: ${{ runner.temp }}/android-internal
      - name: Verify and publish APK
        run: |
          artifact="$RUNNER_TEMP/android-internal"
          apk="$artifact/muxr-$APP_VERSION-$ANDROID_VERSION_CODE.apk"
          result="$artifact/result.json"
          test -f "$apk"
          test -f "$result"
          test "$(find "$artifact" -type f -name '*.apk' | wc -l)" -eq 1
          jq -e \
            --arg gitCommitHash "$GITHUB_SHA" \
            --arg appVersion "$APP_VERSION" \
            --arg appBuildVersion "$ANDROID_VERSION_CODE" \
            '.platform == "ANDROID" and .gitCommitHash == $gitCommitHash and .appVersion == $appVersion and .appBuildVersion == $appBuildVersion and .bundleIdentifier == "com.trymuxr.app" and (.apkArtifactSha256 | test("^[0-9a-f]{64}$"))' \
            "$result" >/dev/null
          test "$(sha256sum "$apk" | cut -d ' ' -f 1)" = "$(jq -r .apkArtifactSha256 "$result")"

          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          test "$tag" = "v$APP_VERSION"

          publish="$RUNNER_TEMP/github-release"
          mkdir -p "$publish"
          install -m 644 "$apk" "$publish/muxr-android-$APP_VERSION-build$ANDROID_VERSION_CODE.apk"
          install -m 644 "$apk" "$publish/muxr-android.apk"
          (cd "$publish" && sha256sum muxr-android-$APP_VERSION-build$ANDROID_VERSION_CODE.apk muxr-android.apk > SHA256SUMS)
          gh release upload "$tag" "$publish/muxr-android-$APP_VERSION-build$ANDROID_VERSION_CODE.apk" "$publish/muxr-android.apk" "$publish/SHA256SUMS" --clobber --repo "$GITHUB_REPOSITORY"

          downloaded="$RUNNER_TEMP/published-release"
          mkdir -p "$downloaded"
          gh release download "$tag" --pattern "muxr-android-$APP_VERSION-build$ANDROID_VERSION_CODE.apk" --pattern muxr-android.apk --pattern SHA256SUMS --dir "$downloaded" --repo "$GITHUB_REPOSITORY"
          (cd "$downloaded" && sha256sum --check SHA256SUMS)
