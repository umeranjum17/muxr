id = "muxr.code"
name = "Code"
version = "0.1.0"
min_herdr_version = "0.8.0"
platforms = ["linux", "macos"]
description = "Installed by muxr — do not install directly. Browse files, review changes, and read git history for the repository you are working in"

[[actions]]
id = "open"
title = "Open Code"
description = "Review the worktree beside the focused agent pane, as a muxr surface (no terminal pane)"
contexts = ["global"]
command = ["bash", "open.sh"]

# Declared Surface launch: muxr Tools runs this action in place with the
# originating agent pane's context (no tab, no shell, no terminal pane) and
# the action reaches the surface broker with that pane's identity. Herdr
# itself ignores this section.
[surface]
launch = "broker"
