appId: com.trymuxr.app
---
# The nav chip row scrolls horizontally and Inbox sits past the fold. One swipe
# does not always reach it, and Maestro then spends fifteen seconds hunting,
# which eats the whole shot window.
- swipe:
    start: "88%, 12%"
    end: "12%, 12%"
    duration: 650
- waitForAnimationToEnd:
    timeout: 2000
- swipe:
    start: "88%, 12%"
    end: "38%, 12%"
    duration: 650
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Inbox"
# Assert on a row, not on the chip: the chip is still on screen either way.
- extendedWaitUntil:
    visible: ".*finished"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
# Hold. Maestro has no sleep, and a swipe on this screen lands on a session row
# and opens it — the rows are the whole list. Re-asserting costs a hierarchy
# dump each time, which is the wait, and touches nothing.
- repeat:
    times: 7
    commands:
      - assertVisible: ".*finished"
      - waitForAnimationToEnd:
          timeout: 900
