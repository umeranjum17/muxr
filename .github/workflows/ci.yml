name: ci

# The `suite` job below is intended as a required status check on main. Removing or
# renaming it, or removing the pull_request trigger, leaves every PR with no automatic
# validation while its checks tab can still read green. Change this block and main's
# branch protection together. Deliberately no push trigger: release.yml is the one
# workflow a merge to main starts.
#
# `fast` runs beside it, not before it: a type error or a broken flow test should
# be visible in about two minutes rather than behind a full build, a web export
# and an install smoke. Neither job publishes, deploys, packs, or tags anything.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        github.head_ref != 'main' && !startsWith(github.head_ref, 'release/') &&
        github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') &&
        !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Typecheck, the compiled self-checks, every vitest flow, and the architecture
  # policies -- the exact list `yarn check:fast` runs, so a red mark here is
  # reproducible in one local command. It deliberately does NOT build a package,
  # export the web app, drive an install, or touch a release artifact: it is
  # early feedback on a pull request, never a release trigger.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The constraints floor guard diffs the pull request against its
          # merge base, which a depth-1 checkout cannot compute.
          fetch-depth: 0
      # A documentation- or evidence-only change cannot affect this job. The
      # job still runs and reports success so it stays a required check; its
      # expensive steps are the ones skipped. The decision is fail-open and
      # treats README.md/SKILL.md as non-docs, because the product reads them;
      # scripts/diagnostics/application/scopeDocsOnly.mjs owns the rule for
      # both jobs.
      - name: Scope (a docs/evidence-only change cannot affect this job)
        id: scope
        run: node scripts/diagnostics/application/scopeDocsOnly.mjs "${{ github.event.pull_request.base.sha }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: 22
          cache: yarn
      - if: steps.scope.outputs.docs_only != 'true'
        run: yarn install --frozen-lockfile --non-interactive
      - name: Fast lane (typecheck, self-checks, vitest flows, architecture)
        if: steps.scope.outputs.docs_only != 'true'
        run: yarn run check:fast

  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same reason as the fast job: the floor guard needs real history.
          fetch-depth: 0
      # Same docs/evidence-only scope as `fast` (plus README.md/SKILL.md as
      # non-docs, since the product reads them), and the same fail-open rule.
      # scripts/diagnostics/application/scopeDocsOnly.mjs owns the rule.
      - name: Scope (a docs/evidence-only change cannot affect this job)
        id: scope
        run: node scripts/diagnostics/application/scopeDocsOnly.mjs "${{ github.event.pull_request.base.sha }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: 22
          cache: yarn
      - if: steps.scope.outputs.docs_only != 'true'
        run: yarn install --frozen-lockfile --non-interactive
      - if: steps.scope.outputs.docs_only != 'true'
        run: yarn build
      - name: Production web export (self-host, origin-clean)
        if: steps.scope.outputs.docs_only != 'true'
        run: yarn web:export:selfhost
      - name: Web export checks against dist (manifest, budget, no marketing origin)
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/diagnostics/application/checkWebExport.mjs
      - name: Live web serving delivery (relay + static server over HTTP)
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/diagnostics/application/checkWebServing.mjs
      - name: Export chain isolation (canary export + full-dist secret scan)
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/diagnostics/application/checkExportIsolation.mjs
      - name: Full suite (typecheck, crypto, pairing, e2e, package smoke, purity, secrets, architecture)
        if: steps.scope.outputs.docs_only != 'true'
        run: yarn run check
      - name: Core purity guard
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/diagnostics/application/checkCorePurity.mjs

  # Proof gate: runs the fast lane again as the done-done `fast` journey and
  # checks the capture against this commit, so the merge gate consumes
  # commit-tied proof instead of a bare log. Pair with `suite` in branch
  # protection once it is green (change this block and protection together,
  # per the header above). Never publishes, deploys, packs, or tags anything.
  done-done:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check --trusted-ref reads the merge-gate rules from main, and the
          # run ties its capture to this commit; both need real history.
          fetch-depth: 0
      # Same docs/evidence-only scope as `fast` and `suite`:
      # scripts/diagnostics/application/scopeDocsOnly.mjs owns the rule.
      - name: Scope (a docs/evidence-only change cannot affect this job)
        id: scope
        run: node scripts/diagnostics/application/scopeDocsOnly.mjs "${{ github.event.pull_request.base.sha }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: 22
          cache: yarn
      - if: steps.scope.outputs.docs_only != 'true'
        run: yarn install --frozen-lockfile --non-interactive
      - if: steps.scope.outputs.docs_only != 'true'
        run: yarn build
      - name: Fast lane as done-done proof (run, then check against this commit)
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          npx -y done-done-axi run fast
          # Detached HEAD names no claim, so pass the PR branch explicitly.
          CLAIM_ID="${{ github.head_ref || github.ref_name }}"
          # Bootstrap: this config is new in this PR, so origin/main has no
          # .done-done.yaml to trust yet; check against the working-tree
          # config until it lands, then --trusted-ref applies again.
          if git cat-file -e "origin/main:.done-done.yaml" 2>/dev/null; then
            TRUSTED_REF_ARGS="--trusted-ref origin/main"
          else
            TRUSTED_REF_ARGS=""
          fi
          npx -y done-done-axi check --outcome "the pull-request fast lane passes on this commit" ~/.done-done/evidence/pockit/*/*.log --claim-id "$CLAIM_ID" $TRUSTED_REF_ARGS
