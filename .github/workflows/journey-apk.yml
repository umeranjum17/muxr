name: release journey APK

# The stable APK carries only arm64-v8a libraries, which React Native cannot
# load on an x86_64 emulator. This builds the x86_64 APK the release journey
# runs instead, from the release's own tag, and checks the released APK
# against the bytes its release sealed (scripts/release/application/checkReleaseApk.mjs).
# The artifact holds the journey APK, its build record and
# .done-done-receipts/builds/<version>.release-apk.json; see docs/RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version whose GitHub release the journey tests, for example 0.2.12
        required: true
        type: string

concurrency:
  group: journey-apk-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate request
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          path: src
          persist-credentials: false
      # The release's own tag predates the check, so it runs from this workflow's commit,
      # kept beside the tag's checkout so the build's clean-source record stays true.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gate
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: yarn
          cache-dependency-path: src/yarn.lock
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: src/apps/mobile/android/**/*.gradle*
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Download the sealed release
        run: |
          dir="$RUNNER_TEMP/release"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$dir" \
            --pattern '*.apk' --pattern release-manifest.json --pattern signer.txt \
            --pattern compiled-manifest.xml --pattern native-provenance.json
          apk="$(basename "$(ls "$dir"/*.apk)")"
          code="${apk%.apk}"; code="${code##*-}"
          [[ "$code" =~ ^[1-9][0-9]*$ ]]
          echo "ANDROID_VERSION_CODE=$code" >> "$GITHUB_ENV"
      - name: Carry the store project id into the build
        working-directory: src
        run: echo "MUXR_EAS_PROJECT_ID=$(jq -er '.build.production.env.MUXR_EAS_PROJECT_ID' apps/mobile/eas.json)" >> "$GITHUB_ENV"
      - name: Build the x86_64 journey APK from the tag
        working-directory: src
        run: MUXR_PR_APK_ABI=x86_64 node perf/buildPrApk.mjs "$RUNNER_TEMP/journey"
      - name: Check the released APK against its sealed bytes
        run: |
          rm -f "$RUNNER_TEMP/journey/test.keystore"
          node gate/scripts/release/presentation/checkReleaseApk.mjs --version "$VERSION" --release "$RUNNER_TEMP/release" \
            --journey-apk "$RUNNER_TEMP/journey/app-release.apk" --repo "$RUNNER_TEMP/journey"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: journey-apk-${{ inputs.version }}
          path: ${{ runner.temp }}/journey
          if-no-files-found: error
          include-hidden-files: true
